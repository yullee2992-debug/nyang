<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리 냥이마을</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#ffb3c6">
<meta name="description" content="친구들과 함께 각자의 고양이를 키우는 냥이마을">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="냥이마을">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* layout: one phone-width app column — sticky header, scene card, controls, fixed bottom tab bar; a single pastel "cozy room" look */
:root{
  --bg:#e7f3ef;      /* mint wall of the village */
  --paper:#ffffff;
  --ink:#3b3346;     /* plum ink */
  --muted:#857c8f;
  --line:#d9e8e3;
  --pink:#ff8fab;
  --pink-d:#e0607f;
  --pink-l:#ffe3ea;
  --teal:#4fae9c;
  --teal-l:#d7f0ea;
  --gold:#f2b33d;
  --gold-l:#fff1cf;
  --sky:#d6ecf8;
  --hunger:#f4a259; --mood:#ff8fab; --clean:#6cbfe8; --energy:#8bcf6a;
  --display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font-family:var(--display);font-size:15px;color:var(--ink);cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
input{font-family:var(--body);font-size:16px;color:var(--ink)}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
.app{max-width:560px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px 10px}
.top .ttl{flex:1;min-width:0}
.top h1{font-size:1.32rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{font-size:.8em;color:var(--muted)}
.top .sub{font-size:.82rem;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.coin{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;font-family:var(--display);font-size:1rem}
.coin i{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe08a,var(--gold) 60%,#c98c1c);display:inline-block;box-shadow:inset 0 0 0 2px #e3a227}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--paper);border:1.5px solid var(--line);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}

/* scene */
.scene{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:4/3;max-height:52vh;width:100%;background:var(--sky);border:2px solid #fff;box-shadow:0 6px 0 rgba(59,51,70,.06)}
.scene>svg.bg{position:absolute;inset:0;width:100%;height:100%}
.catwrap{position:absolute;bottom:4%;left:50%;width:44%;max-width:240px;transform:translateX(-50%);transition:left 2.4s ease-in-out;cursor:pointer;touch-action:manipulation}
.catwrap .flip{transition:transform .3s}
.catwrap svg{display:block;width:100%;height:auto;animation:breathe 3.2s ease-in-out infinite;transform-origin:50% 95%}
@keyframes breathe{50%{transform:scale(1.015,.985)}}
.bubble{position:absolute;left:50%;bottom:100%;transform:translate(-50%,-2px);background:#fff;border-radius:14px;padding:6px 12px;font-family:var(--display);font-size:.92rem;white-space:nowrap;box-shadow:0 3px 0 rgba(59,51,70,.08);pointer-events:none}
.bubble::after{content:"";position:absolute;left:50%;top:100%;border:7px solid transparent;border-top-color:#fff;transform:translateX(-50%)}
.zz{position:absolute;right:8%;top:6%;font-family:var(--display);color:#6a6aa8;font-size:1.4rem;animation:zz 2.4s ease-in-out infinite}
@keyframes zz{50%{transform:translateY(-8px);opacity:.6}}
.heart{position:absolute;pointer-events:none;width:22px;height:22px;animation:heart 1s ease-out forwards}
@keyframes heart{from{transform:translateY(0) scale(.6);opacity:1}to{transform:translateY(-70px) scale(1.2);opacity:0}}
.scene .hint{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.85);border-radius:999px;padding:4px 10px;font-size:.78rem;color:var(--muted)}
.switcher{display:flex;gap:8px;overflow-x:auto;padding-block:2px 10px}
.switcher button{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:3px 12px 3px 3px;font-size:.88rem}
.switcher button.on{border-color:var(--pink);background:var(--pink-l)}
.switcher svg{width:30px;height:30px}

/* stats */
.panel{background:var(--paper);border-radius:20px;padding:14px;border:1.5px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:12px;padding-block:4px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.stat label{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);margin-bottom:4px}
.stat label b{font-family:var(--display);font-weight:400;color:var(--ink)}
.bar{height:10px;border-radius:99px;background:#eef2f1;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .5s}
.bar.low i{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.5}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.78rem;padding:3px 10px;border-radius:999px;background:var(--teal-l);color:#2b6f62;letter-spacing:.02em}
.chip.pink{background:var(--pink-l);color:#b2415f}
.chip.gold{background:var(--gold-l);color:#8a5a00}
.chip.gray{background:#eef0f2;color:#5f6670}
.meta{display:flex;flex-direction:column;gap:8px}
.xp{display:flex;align-items:center;gap:10px;font-size:.82rem;color:var(--muted)}
.xp .bar{flex:1;height:7px}
.grow{font-size:.8rem;color:var(--muted)}

/* actions */
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.act{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;border-radius:16px;background:var(--paper);border:1.5px solid var(--line);font-size:.86rem;position:relative}
.act span.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.act span.ic svg{width:22px;height:22px}
.act small{font-family:var(--body);font-size:.68rem;color:var(--muted);position:absolute;top:4px;right:6px}
.act:not(:disabled):active{transform:translateY(2px)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(255,255,255,.96);border-top:1.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;font-size:.78rem;color:var(--muted);position:relative}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--pink-d)}
.dot{position:absolute;top:6px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--pink-d);border:2px solid #fff}

/* sheets & toast */
.backdrop{position:fixed;inset:0;background:rgba(40,32,52,.38);z-index:40;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:560px;max-height:88vh;overflow:auto;z-index:41;background:var(--paper);border-radius:24px 24px 0 0;padding-block:8px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));animation:up .25s ease-out}
@keyframes up{from{transform:translate(-50%,40px);opacity:.4}}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:#e3e3ea;margin:4px auto 12px}
.sheet h2{font-size:1.3rem;margin-bottom:4px}
.sheet .lead{color:var(--muted);font-size:.88rem;margin:0 0 12px;line-height:1.55}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-family:var(--display);font-size:.95rem;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.18);animation:fade .2s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:14px;padding:11px 18px;background:var(--pink);color:#fff;font-size:1rem;box-shadow:0 3px 0 var(--pink-d)}
.btn.teal{background:var(--teal);box-shadow:0 3px 0 #368a7a}
.btn.ghost{background:var(--paper);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.small{padding:7px 12px;font-size:.88rem;border-radius:11px}
.btn.block{width:100%}
.btn:not(:disabled):active{transform:translateY(2px);box-shadow:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;border:1.5px solid var(--line);background:var(--paper)}
.item .tx{flex:1;min-width:0}
.item .tx b{font-family:var(--display);font-weight:400;font-size:1rem;display:block}
.item .tx span{font-size:.8rem;color:var(--muted)}
.thumb{width:52px;height:52px;flex:0 0 52px;border-radius:14px;background:var(--pink-l);display:grid;place-items:center;overflow:hidden}
.thumb svg{width:100%;height:100%}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px}
.tabs button{flex:0 0 auto;padding:7px 14px;border-radius:999px;background:var(--paper);border:1.5px solid var(--line);font-size:.9rem}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* shop */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:6px}
.card .pic{aspect-ratio:1;border-radius:14px;background:linear-gradient(180deg,#fff6f8,#fde7ee);display:grid;place-items:center;overflow:hidden}
.card .pic svg{width:86%;height:86%}
.card b{font-family:var(--display);font-weight:400;font-size:1rem}
.card .d{font-size:.75rem;color:var(--muted);line-height:1.45;min-height:2.2em}
.price{display:flex;align-items:center;justify-content:space-between;gap:6px}
.price span{font-family:var(--display);display:inline-flex;align-items:center;gap:4px}
.price span i{width:14px;height:14px;border-radius:50%;background:var(--gold);display:inline-block;box-shadow:inset 0 0 0 2px #e3a227}

/* plaza */
.plaza{position:relative;isolation:isolate;border-radius:22px;overflow:hidden;width:100%;aspect-ratio:1/1;max-height:62vh;border:2px solid #fff}
.plaza>svg.bg{position:absolute;inset:0;width:100%;height:100%}
.pcat{position:absolute;width:22%;max-width:120px;transform:translate(-50%,-100%);transition:left 3.5s linear,top 3.5s linear;cursor:pointer;text-align:center}
.pcat .flip{transition:transform .3s}
.pcat svg{width:100%;height:auto;display:block}
.tag{display:inline-block;margin-top:-4px;background:rgba(255,255,255,.92);border-radius:999px;padding:2px 8px;font-size:.68rem;font-family:var(--display);white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.tag i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#c3c3cc;margin-right:4px;vertical-align:1px}
.tag i.on{background:#3cc46b}
.online{font-size:.82rem;color:var(--muted)}

/* gate & creator */
.gate{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:18px;padding-block:28px}
.gate .hero{width:min(260px,70%);margin:0 auto}
.gate h1{font-size:2.2rem;text-align:center;color:var(--pink-d)}
.gate p{text-align:center;color:var(--muted);margin:0;line-height:1.6}
.mode{font-size:.8rem;background:var(--gold-l);color:#7a5200;border-radius:14px;padding:10px 12px;line-height:1.55}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.85rem;color:var(--muted)}
.field input{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;width:100%}
.err{color:#c43d5c;font-size:.85rem;min-height:1.2em}
.creator .preview{background:linear-gradient(180deg,#fff,#fde9ef);border-radius:22px;border:2px solid #fff;display:grid;place-items:center;padding:10px;position:relative}
.creator .preview svg{width:min(240px,62%);height:auto}
.creator .preview .rand{position:absolute;right:10px;top:10px}
.opt h3{font-size:.95rem;margin:4px 0 8px;color:var(--muted)}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.sw button.on{box-shadow:0 0 0 3px var(--pink-d)}
.sw label.custom{width:38px;height:38px;border-radius:50%;box-shadow:0 0 0 1.5px var(--line);background:conic-gradient(red,orange,yellow,lime,cyan,blue,magenta,red);position:relative;overflow:hidden;cursor:pointer}
.sw label.custom input{position:absolute;inset:0;opacity:0;cursor:pointer}
.ch{display:flex;flex-wrap:wrap;gap:8px}
.ch button{padding:8px 14px;border-radius:999px;background:var(--paper);border:1.5px solid var(--line);font-size:.92rem}
.ch button.on{background:var(--pink);border-color:var(--pink);color:#fff}

/* minigames */
.game{position:relative;width:100%;aspect-ratio:4/3;max-height:46vh;border-radius:18px;background:repeating-linear-gradient(90deg,#f6efe4 0 26px,#efe5d6 26px 52px);overflow:hidden;touch-action:manipulation}
.laser{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:radial-gradient(circle,#fff 0 18%,#ff3b5c 30%,rgba(255,59,92,.25) 62%,transparent 70%);transition:left .55s ease-out,top .55s ease-out;cursor:pointer}
.gstat{display:flex;justify-content:space-between;font-family:var(--display);margin:8px 2px}
.meter{position:relative;height:34px;border-radius:12px;background:#f0edf4;overflow:hidden;margin:14px 0}
.meter .zone{position:absolute;top:0;bottom:0;background:#9fe0b0}
.meter .mk{position:absolute;top:-2px;bottom:-2px;width:6px;margin-left:-3px;background:var(--ink);border-radius:3px}
.cmd{font-family:var(--display);font-size:2rem;text-align:center;color:var(--pink-d);margin-top:6px}
.feed{display:flex;flex-direction:column}
.feed div{display:flex;gap:10px;padding:10px 2px;border-bottom:1px dashed var(--line);font-size:.9rem;line-height:1.5}
.feed time{color:var(--muted);font-size:.75rem;flex:0 0 52px;padding-top:2px}
.empty{text-align:center;color:var(--muted);padding:28px 10px;line-height:1.6}
.sect{font-family:var(--display);font-size:1.05rem;margin:6px 2px 2px}

/* desktop pet mode (Electron transparent strip above the taskbar) */
html.pet,html.pet body{background:transparent!important;overflow:hidden;height:100%}
html.pet body::before{display:none}
html.pet .app{max-width:none;padding:0;min-height:0}
#desk{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.dcat{position:absolute;left:0;bottom:0;width:124px;pointer-events:auto;cursor:pointer;will-change:transform;touch-action:manipulation}
.dcat.friend{width:96px}
.dcat .body{transform-origin:50% 100%}
.dcat.walk .body{animation:hop .52s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-4px) rotate(1.2deg)}}
.dcat .flip{transition:transform .25s}
.dcat .flip svg{display:block;width:100%;height:auto;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}
.dcat .bubble{white-space:normal;width:max-content;max-width:230px;text-align:center;line-height:1.4;font-size:.86rem;bottom:92%;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.dcat .nm{position:absolute;left:50%;bottom:0;transform:translateX(-50%);font-family:var(--display);font-size:11px;background:rgba(255,255,255,.9);border-radius:9px;padding:0 7px;white-space:nowrap;color:var(--ink)}
.dcat .zz{right:0;top:-6px;font-size:1.1rem}
.dcat .heart{width:20px;height:20px}
#dmenu{position:fixed;z-index:50;width:190px;background:#fff;border-radius:14px;padding:6px;box-shadow:0 10px 28px rgba(40,30,60,.28);pointer-events:auto;animation:fade .12s}
#dmenu p{margin:4px 10px 6px;font-family:var(--display);color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dmenu button{display:flex;width:100%;align-items:center;justify-content:space-between;text-align:left;padding:8px 10px;border-radius:9px;font-size:.95rem}
#dmenu button small{font-family:var(--body);font-size:.75rem;color:var(--muted)}
#dmenu button:hover,#dmenu button:focus-visible{background:var(--pink-l)}
#dmenu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
#dpanel{position:fixed;z-index:50;left:50%;transform:translateX(-50%);bottom:180px;width:min(380px,92vw);max-height:calc(100vh - 200px);overflow:auto;background:#fff;border-radius:20px;padding:16px;box-shadow:0 12px 34px rgba(40,30,60,.3);pointer-events:auto;animation:fade .15s}
#dpanel h3{font-size:1.2rem}
.dcat{cursor:grab}.dcat.held{cursor:grabbing}
.dcat.held .body{animation:dangle .7s ease-in-out infinite;transform-origin:50% 12%}
@keyframes dangle{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.dcat.squash .body{animation:squash .4s ease-out}
@keyframes squash{30%{transform:scale(1.2,.75)}70%{transform:scale(.94,1.07)}}

.dcat .mark{position:absolute;right:14%;top:8%;width:26px;height:26px;animation:pulse .5s infinite}
.dcat .mark svg{width:100%;height:100%}
.dcat.act-roll .body{animation:a-roll .62s linear 2;transform-origin:50% 64%}
@keyframes a-roll{to{transform:rotate(360deg)}}
.dcat.act-lie .body{animation:a-lie 2.8s ease-in-out;transform-origin:50% 92%}
@keyframes a-lie{0%,100%{transform:none}15%{transform:rotate(-82deg) translate(10px,6px)}30%{transform:rotate(-90deg) translate(10px,6px)}45%{transform:rotate(-76deg) translate(10px,6px)}60%{transform:rotate(-90deg) translate(10px,6px)}75%{transform:rotate(-80deg) translate(10px,6px)}}
.dcat.act-cute .body{animation:a-cute 2.1s ease-in-out;transform-origin:50% 95%}
@keyframes a-cute{0%,100%{transform:none}15%{transform:rotate(-12deg) scale(1.04)}35%{transform:rotate(12deg) scale(1.04)}55%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
.dcat.act-angry .body{animation:a-angry .19s linear 10;transform-origin:50% 95%}
@keyframes a-angry{0%,100%{transform:translateX(0) scale(1.06,1.08)}50%{transform:translateX(-5px) scale(1.08,1.04)}}
.dcat.act-stretch .body{animation:a-stretch 1.7s ease-in-out;transform-origin:50% 100%}
@keyframes a-stretch{0%,100%{transform:none}35%,65%{transform:scale(1.3,.78)}}
.mcards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mc{position:relative;aspect-ratio:1;border-radius:14px;padding:0;overflow:hidden;cursor:pointer}
.mc .back,.mc .front{position:absolute;inset:0;display:grid;place-items:center;border-radius:14px;transition:transform .3s,opacity .3s;backface-visibility:hidden}
.mc .back{background:repeating-linear-gradient(45deg,var(--pink) 0 8px,#ffa6bd 8px 16px);border:2px solid #fff}
.mc .front{background:#fff;border:2px solid var(--line);opacity:0;transform:scale(.6)}
.mc .front svg{width:80%;height:80%}
.mc.up .back{opacity:0;transform:scale(.6)}.mc.up .front{opacity:1;transform:none}
.mc.ok .front{border-color:#7fd1c0;background:#effaf6}
.spads{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:320px;margin:0 auto}

<script>
(async()=>{
'use strict';
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const DAY=864e5,HOUR=36e5,MIN=6e4;
const now=()=>Date.now();
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const kstDay=t=>new Date((t||now())+9*HOUR).toISOString().slice(0,10);
const ownerKey=n=>n.trim().toLowerCase().replace(/[.$#\[\]\/\s]/g,'_');
function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255]}
const toHex=(r,g,b)=>'#'+[r,g,b].map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join('');
function shade(h,a){const[r,g,b]=hexToRgb(h);return a<0?toHex(r*(1+a),g*(1+a),b*(1+a)):toHex(r+(255-r)*a,g+(255-g)*a,b+(255-b)*a)}
function mix(a,b){const x=hexToRgb(a),y=hexToRgb(b);return toHex((x[0]+y[0])/2,(x[1]+y[1])/2,(x[2]+y[2])/2)}
function lum(h){const[r,g,b]=hexToRgb(h);return(0.299*r+0.587*g+0.114*b)/255}
async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return'x'+h}}
function ago(t){const d=now()-t;if(d<MIN)return'방금';if(d<HOUR)return Math.floor(d/MIN)+'분 전';if(d<DAY)return Math.floor(d/HOUR)+'시간 전';return Math.floor(d/DAY)+'일 전'}
function dur(ms){ms=Math.max(0,ms);const m=Math.floor(ms/MIN),s=Math.floor(ms%MIN/1000);if(m>=60)return Math.floor(m/60)+'시간 '+(m%60)+'분';return m?`${m}분 ${s}초`:`${s}초`}
const josa=(w,a,b)=>{const c=(w||'').charCodeAt((w||'').length-1);if(c<0xac00||c>0xd7a3)return w+a;return w+((c-0xac00)%28?a:b)};
const iGa=w=>josa(w,'이','가'), eunNeun=w=>josa(w,'은','는'), eulReul=w=>josa(w,'을','를'), waGwa=w=>josa(w,'과','와');

/* ================= storage ================= */
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
function LocalStore(){
  const KEY='nyang-demo-db';let root={};
  const read=()=>{try{root=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){root=root||{}}};read();
  const subs=new Set();let bc=null;try{bc=new BroadcastChannel('nyang-demo')}catch(e){}
  let pend=false;
  const notify=()=>{if(pend)return;pend=true;setTimeout(()=>{pend=false;for(const s of subs)s.cb(clone(getP(s.path)))},0)};
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(root))}catch(e){}try{bc&&bc.postMessage(1)}catch(e){}notify()};

}

  if(myC.spouse)return`${myC.name}${eunNeun(myC.name).slice(-1)} 이미 결혼했어요`;

  if(t.aff<70)return`${t.name}의 애정도가 70 이상이어야 해요`;

const RANKG={match:{n:'카드 짝 맞추기',better:(a,b)=>!b||a.moves<b.moves||(a.moves===b.moves&&a.ms<b.ms),fmt:r=>`${r.moves}번 · ${(r.ms/1000).toFixed(1)}초`,cmp:(a,b)=>a.moves-b.moves||a.ms-b.ms},
  simon:{n:'발자국 순서 기억',better:(a,b)=>!b||a.stage>b.stage,fmt:r=>`${r.stage}단계`,cmp:(a,b)=>b.stage-a.stage||a.at-b.at}};
async function saveBest(g,rec){
  rec.at=now();let improved=false;
  await Store.tx('users/'+S.me+'/best/'+g,cur=>{if(RANKG[g].better(rec,cur)){improved=true;return rec}improved=false;return});
  const wk=weekKey(),prev=weekKey(now()-7*DAY);
  await Store.tx('users/'+S.me+'/wb',W=>{W=W||{};for(const k of Object.keys(W))if(k!==wk&&k!==prev)delete W[k];W[wk]=W[wk]||{};if(RANKG[g].better(rec,W[wk][g]))W[wk][g]=Object.assign({},rec);return W});
  return improved;
}
function rankList(g,wk){return Object.entries(S.users).map(([k,u])=>({k,name:u&&u.name,r:u&&(wk?(u.wb&&u.wb[wk]&&u.wb[wk][g]):(u.best&&u.best[g]))})).filter(x=>x.r).sort((a,b)=>RANKG[g].cmp(a.r,b.r))}
const WRREW=[{c:300,s:2},{c:200,s:1},{c:100,s:0}];
const rewTxt=R=>`${R.c}코인${R.s?' ⭐'+R.s:''}`;

const GIFT_SVG=(c1='#e2453c',c2='#2f9e6e')=>`<svg viewBox="0 0 60 60"><rect x="8" y="24" width="44" height="30" rx="4" fill="${c1}" stroke="#8c2a22" stroke-width="2"/><rect x="5" y="16" width="50" height="11" rx="3" fill="${c1}" stroke="#8c2a22" stroke-width="2"/><rect x="26" y="16" width="8" height="38" fill="#ffd43b"/><path d="M30 16 C20 2 10 10 18 16 M30 16 C40 2 50 10 42 16" stroke="${c2}" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`;
function xmasState(u){u=u||me()||{};const D=kstDay(),x=u.xmas||{};return{D,n:x.n||0,got:x.d===D?(x.got||{}):{}}}
function xboxes(){
  if(!isXmas()||!me())return[];const st=xmasState(),h=new Date(now()+9*HOUR).getUTCHours();
  return XBOX_HRS.map((hr,i)=>{const r=seeded(strHash(S.me+st.D+'box'+i));return{i,hr,open:h>=hr,got:!!st.got[i],x:12+r()*76,y:62+r()*30}});
}
function snowHTML(n=30){return`<div class="snowfx" aria-hidden="true">${Array.from({length:n},(_,i)=>{const z=3+i%4;return`<i style="left:${(i*37+11)%100}%;width:${z}px;height:${z}px;opacity:${.6+(i%3)*.15};animation-duration:${7+(i%6)}s;animation-delay:${-((i*.83)%9)}s"></i>`}).join('')}</div>`}
async function openXbox(i){
  const b=xboxes()[i];if(!b||!b.open||b.got)return;const D=kstDay();
  const r=seeded(strHash('xr'+S.me+D+i))();
  const rew=r<.4?{c:30+Math.floor(r*75)}:r<.65?{it:'churu',n:1}:r<.85?{it:'kibble',n:3}:{it:'smelt',n:2};
  let total=0,rud=false;
  const res=await Store.tx('users/'+S.me,u=>{if(!u)return u;const o=u.xmas||{};const x={d:D,got:o.d===D?Object.assign({},o.got||{}):{},n:o.n||0};if(x.got[i])return;x.got[i]=1;x.n++;total=x.n;u.xmas=x;
    if(rew.c)u.coins=(u.coins||0)+rew.c;else{u.inv=u.inv||{};u.inv[rew.it]=(u.inv[rew.it]||0)+rew.n}
    rud=false;if(x.n>=XMAS_GOAL&&!(u.inv&&u.inv.rudolph)){u.inv=u.inv||{};u.inv.rudolph=1;rud=true}return u});
  if(!res.committed)return;
  if(rud)log(`${ownerName(S.me)}님이 선물상자 ${XMAS_GOAL}개를 모아 루돌프 미니펫을 받았어요!`);
  const c=activeCat();
  openSheet(`<div class="celebc">${rud?`<div class="confetti">${confettiHTML()}</div>`:''}<div style="width:90px;margin:0 auto">${GIFT_SVG()}</div><h2>${rud?'루돌프가 왔어요!':'선물상자를 찾았어요!'}</h2><p class="lead">${rew.c?`<b>${rew.c}코인</b>이 들어 있었어요.`:`<b>${ITEMS[rew.it].n} ${rew.n}개</b>가 들어 있었어요.`}<br>모은 선물상자 ${Math.min(total,XMAS_GOAL)} / ${XMAS_GOAL}${total>XMAS_GOAL?` (총 ${total}개)`:''}</p>
  ${rud&&c?`<div style="width:62%;margin:0 auto">${catSVG(Object.assign({},live(c),{eq:Object.assign({},c.eq,{mpet:'rudolph'})}))}</div><p class="lead">루돌프 미니펫을 받았어요! '꾸미기 → 미니펫'에서 데리고 다닐 수 있어요.</p>`:total<XMAS_GOAL?`<div class="bar" style="height:9px;margin:4px 0 12px"><i style="width:${total/XMAS_GOAL*100}%;background:#e2453c"></i></div><p class="grow">${XMAS_GOAL}개를 모으면 루돌프 미니펫을 받아요.</p>`:''}

}

function fishGame(){
  if(fishLeft()<=0)return toast('조금 쉬었다가 다시 낚시해요');
  if(!((me().inv||{}).bait))return toast('미끼가 없어요. 낚시터에서 미끼를 사 주세요');
  const c=activeCat();
  openSheet(`<h2>냥이 낚시터</h2><p class="lead">던진 다음, 찌가 쑥 들어가며 <b>!</b>가 뜨면 바로 당기세요. 너무 빨리 당기면 물고기가 도망가요.</p>
  <div class="pond" data-live="1"><svg viewBox="0 0 320 200" preserveAspectRatio="none"><rect width="320" height="200" fill="#bfe3f5"/><path d="M0 70 Q80 60 160 68 T320 64 V200 H0Z" fill="#6fb7de"/><path d="M0 70 Q80 60 160 68 T320 64" stroke="#e7f6ff" stroke-width="3" fill="none"/>${[[60,110],[150,140],[240,100],[280,160],[110,175]].map(([x,y])=>`<path d="M${x-14} ${y} q14 -6 28 0" stroke="#a8d8f0" stroke-width="2.5" fill="none" opacity=".8"/>`).join('')}<path d="M0 150 Q30 120 70 140 L90 200 H0Z" fill="#8bc47a"/><path d="M286 200 l6 -46 M296 200 l2 -54 M306 200 l-4 -40" stroke="#5f9e55" stroke-width="4" stroke-linecap="round"/>
  <path id="rod" d="M70 128 L130 60" stroke="#8a5a32" stroke-width="4" stroke-linecap="round"/><path id="fline" d="M130 60 L130 60" stroke="#3b3346" stroke-width="1.2" fill="none"/>
  <g id="bobw" style="display:none"><g id="bob"><circle cx="0" cy="0" r="7" fill="#fff" stroke="#3b3346" stroke-width="1.5"/><path d="M-7 0 A7 7 0 0 1 7 0Z" fill="#e2453c"/></g></g></svg>
  <div class="fcat">${c?catSVG(live(c),{still:true}):''}</div><div class="fmsg" id="fmsg">던지기를 눌러보세요</div></div>

  <button class="btn teal block" id="fbtn">던지기</button><div class="list" id="fcatch" style="margin-top:10px"></div>`);
  let st='idle',fish=null,tm=[],bx=0,by=0,biteAt=0,caught=0;
  const clear=()=>{tm.forEach(clearTimeout);tm=[]};
  const T=(f,ms)=>tm.push(setTimeout(()=>{if(!$('#fbtn')){clear();return}f()},ms));
  const msg=t=>{const m=$('#fmsg');if(m)m.textContent=t};
  const bob=cls=>{const b=$('#bob');if(b)b.setAttribute('class',cls||'')};
  const pick=()=>{let r=Math.random(),a=0;for(const f of FISH){a+=f.p;if(r<a)return f}return FISH[0]};
  const btn=$('#fbtn');
  const end=async(ok,why)=>{clear();st='busy';const wasShark=fish&&fish.shark;$('#bobw').style.display='none';$('#fline').setAttribute('d','M130 60 L130 60');document.querySelectorAll('.fbite').forEach(e=>e.remove());
    if(ok&&fish.shark){const c=activeCat();msg('상어에게 물렸어요!');achAdd('shark');if(c)dyAdd(c.id,'shark');
      if(c)await catTx(c.id,(c,res)=>{c.sick={k:'bite',at:now()};c.st.mood=clamp(c.st.mood-25);c.st.energy=clamp(c.st.energy-20)});
      log(`${ownerName(S.me)}님의 ${c?c.name:'고양이'}${c?iGa(c.name).slice(-1):'가'} 낚시하다 상어에게 물렸어요!`);
      $('#fcatch').insertAdjacentHTML('afterbegin',`<div class="item" style="background:#ffe3e3;border-color:#ffc4c4"><div class="thumb" style="width:40px;height:40px;flex-basis:40px">${fishPic('shark')}</div><div class="tx"><b>상어에게 물렸어요!</b><span>${c?esc(c.name):'고양이'}${c?iGa(c.name).slice(-1):'가'} 다쳤어요. 알약을 먹여 주세요.</span></div></div>`);
      document.querySelector('.pond').classList.add('shake');setTimeout(()=>{const pd=$('.pond');if(pd)pd.classList.remove('shake')},600);
      ok=false;fish=null}
    else if(ok&&fish.esc&&Math.random()<fish.esc){msg(`앗! ${fish.n}${iGa(fish.n).slice(-1)} 줄을 끊고 도망갔어요`);ok=false;fish=null}
    if(ok){const sz=Math.round(fish.sz[0]+Math.random()*(fish.sz[1]-fish.sz[0]));let rec=false;
      await Store.tx('users/'+S.me,u=>{if(!u)return u;u.fish=u.fish||{};u.fish.cnt=(u.fish.cnt||0)+1;u.fish.best=u.fish.best||{};rec=false;if(!u.fish.best[fish.k]||sz>u.fish.best[fish.k]){u.fish.best[fish.k]=sz;rec=true}if(fish.it){u.inv=u.inv||{};u.inv[fish.it]=(u.inv[fish.it]||0)+1}else u.coins=(u.coins||0)+(fish.c||0);return u});
      caught++;achAdd('fish');if(fish.k==='gold')achAdd('gold');{const c=activeCat();if(c)dyAdd(c.id,'fish:'+fish.k)}$('#fcnt').textContent='이번에 잡은 것 '+caught;msg(fish.junk?`${fish.n}... 쓰레기네요`:`${fish.n} ${sz}cm!${rec?' 새 기록!':''}`);
      if(fish.k==='gold')log(`${ownerName(S.me)}님이 황금 잉어 ${sz}cm를 낚았어요!`);
      $('#fcatch').insertAdjacentHTML('afterbegin',`<div class="item"><div class="thumb" style="width:40px;height:40px;flex-basis:40px">${fishPic(fish.k)}</div><div class="tx"><b>${fish.n} ${sz}cm${rec?' <span class="chip pink">새 기록</span>':''}</b><span>${fish.it?ITEMS[fish.it].n+' +1 (간식 가방)':fish.c?fish.c+'코인':'꽝 · 쓰레기는 버렸어요'}</span></div></div>`)}

    if(left<=0){btn.textContent='오늘은 여기까지! 10분 뒤에 다시';btn.disabled=true;btn.onclick=null;const b2=document.createElement('button');b2.className='btn ghost block';b2.style.marginTop='8px';b2.textContent='닫기';b2.onclick=closeSheet;btn.after(b2)}
    else{btn.textContent='다시 던지기';st='idle'}};
  btn.onclick=async()=>{
    if(st==='idle'){
      st='busy';let ok=false;
      await Store.tx('users/'+S.me+'/fish',f=>{f=f||{};if(f.until>now()){ok=false;return}if(f.until){delete f.until;f.left=FISH_N}const l=f.left==null?FISH_N:f.left;if(l<=0){ok=false;return}f.left=l-1;if(f.left<=0){f.until=now()+FISH_REST}ok=true;return f});

      const bt0=((me().inv||{}).bait)||0;
      if(!(await useItem('bait'))){await Store.tx('users/'+S.me+'/fish',f=>{f=f||{};if(f.until){delete f.until;f.left=0}f.left=Math.min(FISH_N,(f.left||0)+1);return f});toast('미끼가 없어요. 낚시터에서 미끼를 사 주세요');st='idle';return}
      $('#fbait').textContent='미끼 '+Math.max(0,bt0-1)+'개';

function clearLayer(){$('#layer').innerHTML='';document.body.style.overflow=''}
function openSheet(html){
  clearLayer();

  document.body.style.overflow='hidden';
  markHist();
  const sh=$('.sheet'),g=sh.querySelector('.grab');let y0=null,dy=0;
  const start=e=>{if(e.target!==g&&sh.scrollTop>0)return;if(e.target!==g&&!e.target.closest('h2'))return;y0=e.clientY;dy=0;sh.style.transition='none'};
  sh.addEventListener('pointerdown',start);
  sh.addEventListener('pointermove',e=>{if(y0==null)return;dy=Math.max(0,e.clientY-y0);sh.style.transform=`translate(-50%,${dy}px)`});
  const end=()=>{if(y0==null)return;y0=null;sh.style.transition='';if(dy>90)closeSheet();else sh.style.transform=''};
  sh.addEventListener('pointerup',end);sh.addEventListener('pointercancel',end);
}

/* ================= quests & attendance ================= */
const DQ=[['pet','내 고양이 쓰다듬기 30번',30],['feed','밥이나 간식 2번 주기',2],['train','교육 1번 하기',1],['play','놀아주기 3번',3],['ex','운동 1번 하기',1],['talk','친구 고양이에게 말 걸기',1],['gift','친구에게 간식이나 꽃 선물하기',1],['lotto','로또 참여하기',1],['visit','친구 집에 놀러가기',1],['book','방명록 1개 쓰기',1],['fpet','친구 고양이 쓰다듬기 10번',10],['bath','목욕시키기',1]];
const WQ=[['train','교육 7번 하기',7],['gift','친구에게 선물 3번 하기',3],['book','방명록 3개 쓰기',3],['att','5일 출석하기',5]];
const QREW={d:{c:30,s:1},all:{c:50,s:1},w:{c:150,s:3}};
const ATT_EX={5:'tiara',10:'bg_moon',15:'medal',20:'clover'},ATT_CELLS=20;
const ATT_REF=Date.parse('2026-11-16T00:00:00+09:00');
function attReward(day){if(ATT_EX[day])return{item:ATT_EX[day],s:1};if(day%5===2||day%5===4)return{c:60,s:1};return{c:100}}
const kstDow=()=>new Date(now()+9*HOUR).getUTCDay();
const isWeekday=()=>{const d=kstDow();return d>=1&&d<=5};
function attBoardId(){return Math.floor((Date.parse(kstDay()+'T00:00:00+09:00')-ATT_REF)/(28*DAY))}
function attRange(b){const st=ATT_REF+b*28*DAY;const f=t=>{const d=new Date(t+9*HOUR);return`${d.getUTCMonth()+1}/${d.getUTCDate()}`};return{start:f(st),end:f(st+27*DAY),left:Math.ceil((st+28*DAY-now())/DAY)}}
function attCur(u){const a=(u&&u.att)||{};return a.b===attBoardId()?(a.n||0):0}
function weekKey(t){const d=new Date((t||now())+9*HOUR);d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7));return d.toISOString().slice(0,10)}
function dailyIds(D){const r=seeded(strHash('nyang-q-'+D+'-'+S.me));const out=[];while(out.length<3){const k=DQ[Math.floor(r()*DQ.length)][0];if(!out.includes(k))out.push(k)}return out}
function qNorm(q){const D=kstDay(),W=weekKey();q=q||{};if(q.d!==D){q.d=D;q.dp={};q.dc={};q.da=false}if(q.w!==W){q.w=W;q.wp={};q.wc={}}q.dp=q.dp||{};q.dc=q.dc||{};q.wp=q.wp||{};q.wc=q.wc||{};return q}
async function qEvent(type,n=1){
  {const c=activeCat();if(c&&['pet','play','bath','ex','train','lotto'].includes(type))dyAdd(c.id,type,n);if(type==='pet')S.petAcc+=n}
  if(!S.me)return;const D=kstDay();const dIds=dailyIds(D);const inD=dIds.includes(type),inW=WQ.some(w=>w[0]===type);if(!inD&&!inW)return;
  let done=[];
  await Store.tx('users/'+S.me+'/q',q=>{q=qNorm(q);done=[];
    if(inD){const tg=DQ.find(x=>x[0]===type)[2];const b=q.dp[type]||0;q.dp[type]=Math.min(tg,b+n);if(b<tg&&q.dp[type]>=tg)done.push(DQ.find(x=>x[0]===type)[1])}
    if(inW){const w=WQ.find(x=>x[0]===type);const b=q.wp[type]||0;q.wp[type]=Math.min(w[2],b+n);if(b<w[2]&&q.wp[type]>=w[2])done.push('주간: '+w[1])}
    return q});
  done.forEach((t,i)=>setTimeout(()=>{toast(`퀘스트 완료! ${t} · 이벤트 탭에서 보상을 받아요`,3000)},i*1200));
}
async function qClaim(kind,id){
  let rew=null,why='';
  const r=await Store.tx('users/'+S.me,u=>{if(!u)return u;u.q=qNorm(u.q);const q=u.q;rew=null;
    if(kind==='d'){const def=DQ.find(x=>x[0]===id);if(!def||!dailyIds(q.d).includes(id)||(q.dp[id]||0)<def[2]||q.dc[id]){why='아직 받을 수 없어요';return}q.dc[id]=true;rew=QREW.d}
    else if(kind==='all'){const ids=dailyIds(q.d);if(q.da||!ids.every(k=>q.dc[k])){why='세 개를 모두 받아야 해요';return}q.da=true;rew=QREW.all}
    else{const def=WQ.find(x=>x[0]===id);if(!def||(q.wp[id]||0)<def[2]||q.wc[id]){why='아직 받을 수 없어요';return}q.wc[id]=true;rew=QREW.w}
    u.coins=(u.coins||0)+(rew.c||0);u.stars=(u.stars||0)+(rew.s||0);return u});
  if(!r.committed)return toast(why||'받지 못했어요');
  if(kind==='d')achAdd('quest');coinFx(`+${rew.c} · ⭐${rew.s}`);toast(`보상 받기 완료! ${rew.c}코인 · ⭐${rew.s}`);
}
function qClaimable(u){if(!u)return 0;const q=qNorm(clone(u.q));const ids=dailyIds(q.d);let n=0;ids.forEach(k=>{const def=DQ.find(x=>x[0]===k);if((q.dp[k]||0)>=def[2]&&!q.dc[k])n++});if(!q.da&&ids.every(k=>q.dc[k]))n++;WQ.forEach(w=>{if((q.wp[w[0]]||0)>=w[2]&&!q.wc[w[0]])n++});return n}
async function attendance(){
  if(!S.me)return;const D=kstDay();let got=null;

    if(u.att.b===undefined){u.att.b=B;u.att.n=Math.min(u.att.n||0,ATT_CELLS)}

    if(u.att.last===D||u.att.n>=ATT_CELLS)return;u.att.n=(u.att.n||0)+1;u.att.last=D;u.att.total=(u.att.total||0)+1;

  if(!r.committed||!got)return;
  qEvent('att');
  const rw=got.rw,txt=[rw.item?`한정 아이템 '${ITEMS[rw.item].n}'`:'',rw.c?`${rw.c}코인`:'',rw.s?`⭐${rw.s}`:''].filter(Boolean).join(' · ');
  if(PET){toast(`출석 도장 ${got.n}번째! ${txt}`,5000);return}
  setTimeout(()=>openSheet(`<h2>이번 출석부 ${got.n}번째 도장 꾹!</h2><p class="lead">오늘 보상: <b>${txt}</b>${rw.dup?' (이미 가진 한정 아이템이라 코인과 스타로 바꿔 드렸어요)':''}</p>${attBoard(got.n,true)}<button class="btn block" style="margin-top:12px" data-a="close">확인</button>`),600);
}

/* ================= lotto ================= */
const LOTTO_N=20,LOTTO_K=4,LOTTO_PRIZE={4:30000,3:3000,2:300,1:50,0:0};
function strHash(t){let h=1779033703^t.length;for(let i=0;i<t.length;i++){h=Math.imul(h^t.charCodeAt(i),3432918353);h=h<<13|h>>>19}return h>>>0}
function seeded(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function lottoDraw(D){const r=seeded(strHash('nyang-lotto-'+D));const a=[];while(a.length<LOTTO_K){const n=1+Math.floor(r()*LOTTO_N);if(!a.includes(n))a.push(n)}return a.sort((x,y)=>x-y)}
const lottoRevealAt=D=>Date.parse(D+'T08:00:00+09:00')+DAY;
const parseNums=t=>String(t||'').split(',').map(Number).filter(Boolean);
function lottoResult(D,nums){const w=lottoDraw(D);const m=nums.filter(n=>w.includes(n)).length;return{w,m,prize:LOTTO_PRIZE[m]}}
function ball(n,cls=''){return`<span class="ball ${cls}">${n}</span>`}
function lottoPending(u){const L=(u&&u.lotto)||{};return Object.keys(L).filter(D=>now()>=lottoRevealAt(D)&&!L[D].claimed&&lottoResult(D,parseNums(L[D].n)).prize>0)}
function viewLotto(){
  const u=me(),L=u.lotto||{},D=kstDay(),mine=L[D],t=now();
  S.lpick=S.lpick||[];
  let top='';
  if(!mine){
    top=`<div class="panel stack"><h2>오늘의 냥이 로또</h2><p class="lead" style="margin:0">1~20 중에서 숫자 <b>4개</b>를 고르세요. 하루에 한 번 무료로 참여하고, <b>내일 아침 8시</b>에 결과가 나와요.</p>
    <div class="lgrid">${Array.from({length:LOTTO_N},(_,i)=>i+1).map(n=>`<button class="lb ${S.lpick.includes(n)?'on':''}" data-a="lnum" data-v="${n}">${n}</button>`).join('')}</div>
    <div class="row"><span class="grow num" style="flex:1">고른 숫자: ${S.lpick.length?S.lpick.slice().sort((a,b)=>a-b).join(', '):'없음'} (${S.lpick.length}/4)</span><button class="btn small ghost" data-a="lauto">자동으로 고르기</button></div>
    <button class="btn block" data-a="lenter" ${S.lpick.length===4?'':'disabled'}>참여하기</button></div>`;
  }else{
    top=`<div class="panel stack"><h2>오늘 참여 완료!</h2><div class="row">${parseNums(mine.n).map(n=>ball(n)).join('')}</div><p class="grow num" style="margin:0">결과 발표: 내일 아침 8시 (${dur(lottoRevealAt(D)-t)} 남음)</p></div>`;
  }
  const rounds=Object.keys(L).filter(x=>x!==D).sort().reverse().slice(0,7);
  const past=rounds.map(R=>{const e=L[R],nums=parseNums(e.n);
    if(t<lottoRevealAt(R))return`<div class="item"><div class="tx"><b>${R} 회차</b><span>발표 대기 · 내일 아침 8시 (${dur(lottoRevealAt(R)-t)} 남음)</span></div><div class="row">${nums.map(n=>ball(n)).join('')}</div></div>`;
    const r=lottoResult(R,nums);
    return`<div class="item" style="flex-wrap:wrap"><div class="tx"><b>${R} 회차 · ${r.m}개 맞힘</b><span>당첨 번호 ${r.w.join(', ')}</span></div><div class="row">${nums.map(n=>ball(n,r.w.includes(n)?'hit':'')).join('')}</div>
    <div style="width:100%" class="row">${r.prize?(e.claimed?`<span class="chip gold num">${r.prize.toLocaleString('ko-KR')}코인 받음</span>`:`<button class="btn small" data-a="lclaim" data-v="${R}">${r.prize.toLocaleString('ko-KR')}코인 받기</button>`):'<span class="chip gray">꽝 · 다음엔 꼭!</span>'}</div></div>`}).join('');
  // village results for latest revealed round
  const all=[];Object.entries(S.users).forEach(([k,x])=>{Object.keys((x&&x.lotto)||{}).forEach(R=>{if(t>=lottoRevealAt(R))all.push(R)})});
  const latest=all.sort().pop();
  let village='';
  if(latest){const rows=Object.entries(S.users).filter(([k,x])=>x&&x.lotto&&x.lotto[latest]).map(([k,x])=>({k,name:x.name,r:lottoResult(latest,parseNums(x.lotto[latest].n))})).sort((a,b)=>b.r.prize-a.r.prize);
    village=`<div class="sect">${latest} 회차 마을 결과 · 당첨 번호 ${lottoDraw(latest).map(n=>ball(n,'hit')).join('')}</div><div class="list">${rows.map(x=>`<div class="item"><div class="tx"><b>${esc(x.name)}</b><span>${x.r.m}개 맞힘</span></div>${x.r.prize?`<span class="chip gold num">${x.r.prize.toLocaleString('ko-KR')}</span>`:'<span class="chip gray">꽝</span>'}</div>`).join('')}</div>`}
  const table=`<div class="panel"><b style="font-family:var(--display);font-weight:400">상금표</b><div class="row" style="margin-top:6px">${[4,3,2,1,0].map(m=>`<span class="chip ${m?'gold':'gray'} num">${m}개 ${LOTTO_PRIZE[m]?LOTTO_PRIZE[m].toLocaleString('ko-KR'):'꽝'}</span>`).join('')}</div></div>`;
  return top+(past?`<div class="sect">내 로또</div><div class="list">${past}</div>`:'')+village+table;
}
async function lottoEnter(){
  const D=kstDay(),nums=(S.lpick||[]).slice().sort((a,b)=>a-b);if(nums.length!==4)return;
  const r=await Store.tx('users/'+S.me,u=>{if(!u)return u;u.lotto=u.lotto||{};if(u.lotto[D])return;u.lotto[D]={n:nums.join(','),at:now()};return u});

async function lottoClaim(R){

  if(m>=3)log(`${ownerName(S.me)}님이 냥이 로또 ${m}개를 맞혀 ${prize.toLocaleString('ko-KR')}코인에 당첨됐어요!`);

function viewCreate(){
  const d=S.draft,L=d.look,step=d.step;const adopt=S.createMode==='adopt';
  const steps=[['fur','털'],['pat','무늬'],['face','얼굴'],['body','몸'],['name','이름']];
  const sw=(key,list,custom)=>`<div class="sw">${list.map(([n,h])=>`<button style="background:${h}" class="${L[key]===h?'on':''}" title="${n}" aria-label="${n}" data-a="lk" data-k="${key}" data-v="${h}"></button>`).join('')}${custom?`<label class="custom" title="직접 고르기"><input type="color" data-k="${key}" class="lkc" aria-label="직접 고르기" value="${L[key]}"></label>`:''}</div>`;
  const ch=(key,list)=>`<div class="ch">${list.map(([v,n])=>`<button class="${String(L[key])===String(v)?'on':''}" data-a="lk" data-k="${key}" data-v="${v}">${n}</button>`).join('')}</div>`;
  let body='';
  if(step==='fur')body=`<div class="opt"><h3>성별을 골라주세요${L.gender?'':' (필수)'}</h3>${ch('gender',[['m','수컷 ♂'],['f','암컷 ♀']])}</div><div class="opt"><h3>털 색</h3>${sw('coat',COATS,1)}</div>`;
  if(step==='pat')body=`<div class="opt"><h3>무늬</h3>${ch('pattern',PATTERNS)}</div>${L.pattern!=='none'?`<div class="opt"><h3>무늬 색</h3>${sw('pcolor',PCOLS,1)}</div>`:''}`;
  if(step==='face')body=`<div class="opt"><h3>눈 색${L.eyeL!==L.eyeR?' (왼쪽)':''}</h3>${sw('eyeL',EYES)}</div><div class="opt"><h3>오드아이</h3>${ch('odd',[['0','아니요'],['1','네, 오른쪽 눈 색 따로']])}</div>${d.odd?`<div class="opt"><h3>오른쪽 눈 색</h3>${sw('eyeR',EYES)}</div>`:''}<div class="opt"><h3>귀</h3>${ch('ear',EARS)}</div><div class="opt"><h3>코 색</h3>${sw('nose',NOSES)}</div><div class="opt"><h3>볼터치</h3>${ch('blush',[['true','있음'],['false','없음']])}</div>`;
  if(step==='body')body=`<div class="opt"><h3>체형</h3>${ch('build',BUILDS)}</div><div class="opt"><h3>꼬리</h3>${ch('tail',TAILS)}</div>`;
  if(step==='name')body=`<div class="field"><label for="cn">고양이 이름</label><input id="cn" maxlength="8" value="${esc(d.name||'')}" placeholder="예: 보리"></div>
    ${adopt?'':`<div class="field"><label for="on">주인이름 (친구들에게 보여요)</label><input id="on" maxlength="10" value="${esc(d.owner||'')}" placeholder="예: 율"></div>
    <div class="field"><label for="op">비밀번호 4자리 (다른 기기에서 들어올 때 써요)</label><input id="op" maxlength="4" inputmode="numeric" type="password" value="${esc(d.pin||'')}"></div>`}
    <p class="grow">성별: ${L.gender==='m'?'수컷 ♂':L.gender==='f'?'암컷 ♀':'<b style="color:#c43d5c">아직 안 골랐어요 (털 탭 맨 위)</b>'}</p><p class="grow" id="np">${esc(d.owner||'주인')}의 ${esc(d.name||'고양이')}</p><p class="err" id="ce"></p><button class="btn block" data-a="finish">${adopt?'분양받기':'우리 가족이 됐어요'}</button>`;
  const i=steps.findIndex(s=>s[0]===step);
  return`<div class="creator stack" style="padding-top:14px"><div class="row" style="justify-content:space-between"><h1 style="font-size:1.4rem">${adopt?'새 고양이 분양받기':'나만의 고양이 만들기'}</h1><button class="btn ghost small" data-a="${adopt?'cancelAdopt':'gate'}">${adopt?'취소':'뒤로'}</button></div>
  <div class="preview"><button class="btn ghost small rand" data-a="random">랜덤</button>${catSVG({look:L,stage:'kitten'},{})}</div>
  <div class="tabs">${steps.map(([k,l])=>`<button class="${k===step?'on':''}" data-a="step" data-v="${k}">${l}</button>`).join('')}</div>
  <div class="stack">${body}</div>
  ${step!=='name'?`<div class="row"><button class="btn ghost" data-a="step" data-v="${steps[Math.max(0,i-1)][0]}" ${i===0?'disabled':''}>이전</button><button class="btn" style="flex:1" data-a="step" data-v="${steps[i+1][0]}">다음</button></div>`:''}</div>`;
}

/* ================= render & events ================= */
function render(){
  if(PET){renderDesk();deskFeed();deskActSync();return}
  const R=$('#root');
  if(S.screen==='gate')R.innerHTML=viewGate();
  else if(S.screen==='login')R.innerHTML=viewLogin();
  else if(S.screen==='create')R.innerHTML=viewCreate();
  else if(S.screen==='app'){
    if(!me())return;
    {const ae=document.activeElement;if(ae&&ae.matches&&ae.matches('main input:not([type=checkbox]),main textarea')&&ae.value){clearTimeout(S.rdef);S.rdef=setTimeout(schedule,1500);return}}
    const v={home:viewHome,shop:viewShop,plaza:viewPlaza,cats:viewCats,news:viewNews,lotto:viewEvents,events:viewEvents,visit:viewVisit,wedding:viewWedding}[S.view]||viewHome;
    const y=window.scrollY;
    R.innerHTML=header()+`<main class="stack">${v()}</main>`+nav();
    window.scrollTo(0,y);
  }
}

const ACTS={

  angry:{ms:1900,expr:'sulky',lines:['하악!','흥! 건드리지 마','캬악!','지금 화났다냥']},
  stretch:{ms:1700,expr:'sleep',lines:['으으~ 기지개','쭈욱~','하암...']},
  jump:{ms:1000,expr:'happy',lines:['폴짝!','점프!','높이 뛴다냥']}

function pickAct(s,noAngry){
  const P=s.ptype||'aloof';
  const w={roll:2,lie:2,cute:s.aff>=60?3:1,angry:noAngry?0:(s.mood<25?5:.5),stretch:1.5,jump:1.5};
  if(P==='cuddly')w.cute*=3;if(P==='grumpy'&&!noAngry)w.angry+=3;if(P==='playful'){w.roll*=2.5;w.jump*=2.5}
  if(P==='lazy'){w.lie*=3;w.stretch*=2;w.jump*=.3;w.roll*=.3}if(P==='sleepy'){w.lie*=2;w.stretch*=3}if(P==='scaredy'){w.jump*=.4;w.cute*=1.5}
  let r=Math.random()*Object.values(w).reduce((a,b)=>a+b,0);
  for(const k in w){r-=w[k];if(r<=0)return k}return'cute';
}
function deskDo(id,act){
  const s=DS[id],el=document.querySelector(`.dcat[data-v="${id}"]`);
  if(!s||!el||s.held||s.away||s.sleep||s.act||!ACTS[act])return;
  const A=ACTS[act],t=now();
  s.act=act;s.actUntil=t+A.ms;s.actExpr=A.expr;s.mode='sit';s.until=s.actUntil+rnd(2e3,5e3);
  Object.keys(ACTS).forEach(k=>el.classList.remove('act-'+k));void el.offsetWidth;el.classList.add('act-'+act);
  if(act==='jump'){s.vy=-13;s.y=Math.max(s.y,1);s.fallFrom=0}
  if(act==='roll'&&Math.random()<.5)s.dir*=-1;
  if(act==='cute')[0,350,700].forEach(d=>setTimeout(()=>{const h=document.createElement('div');h.className='heart';h.style.left=(el.offsetWidth/2-10+rnd(-24,24))+'px';h.style.top='10px';h.innerHTML=heartSVG;el.appendChild(h);setTimeout(()=>h.remove(),1000)},d));
  const mk=el.querySelector('.mark');if(mk)mk.hidden=act!=='angry';
  deskSay(id,pick(A.lines),1800);renderDesk();
  setTimeout(()=>{el.classList.remove('act-'+act);s.act=null;s.actExpr=null;if(mk)mk.hidden=true;renderDesk()},A.ms);
}

  p.innerHTML=`<h3>어떤 친구를 부를까요?</h3><p class="grow" style="margin:2px 0 10px">여러 명 불러도 돼요. 부른 친구 고양이는 내 바탕화면에 놀러 와요.</p>
  ${friends.length?`<div class="list">${friends.map(([k,u])=>{const c=live(S.cats[u.main]);const on=u.seen&&now()-u.seen<3*MIN;const called=deskCalled.includes(k);const away=c.status==='runaway';
    return`<div class="item"><div class="thumb" style="width:44px;height:44px;flex-basis:44px">${catSVG(c,{still:true})}</div><div class="tx"><b>${esc(title(c))}</b><span>${away?'지금 가출 중':on?'접속 중':'오프라인'}</span></div><button class="btn small ${called?'ghost':'teal'}" data-a="dcall" data-v="${k}" ${away&&!called?'disabled':''}>${called?'돌려보내기':'부르기'}</button></div>`}).join('')}</div>`:'<div class="empty">아직 마을에 다른 친구가 없어요.</div>'}
  <div class="row" style="margin-top:10px">${friends.length?'<button class="btn small" data-a="dcallall">모두 부르기</button><button class="btn small ghost" data-a="dsendall">모두 돌려보내기</button><button class="btn small ghost" data-a="dstopall">모두 멈추기</button><button class="btn small ghost" data-a="dwalkall">모두 돌아다니기</button>':''}<button class="btn small ghost" data-a="dpclose" style="margin-left:auto">닫기</button></div>`;
  setThrough();setFull(true);
}
const callLogT={};
function deskCall(k,on){
  const u=S.users[k];if(!u)return;const c=S.cats[u.main];
  if(on){if(deskCalled.includes(k))return;if(!c||live(c).status==='runaway')return;deskCalled.push(k);saveCalled();
    const H=Math.min(window.screen.availHeight||800,1000);
    DS[c.id]={x:rnd(60,Math.max(80,window.innerWidth-200)),y:H-260,vx:0,vy:0,dir:1,mode:'sit',until:now()+4e3,sig:'',arriving:true,fallFrom:0};
    if(!callLogT[k]||now()-callLogT[k]>10*MIN){callLogT[k]=now();log(`${ownerName(S.me)}님이 ${title(c)}${eulReul(c.name).slice(-1)} 바탕화면에 초대했어요.`)}
  }else{
    deskCalled=deskCalled.filter(x=>x!==k);saveCalled();if(c)delete DS[c.id];
  }
  renderDesk();
}
async function deskAction(a,id,e){
  const s=DS[id];closeDeskMenu();deskClicked=id;
  switch(a){
    case'open':DK&&DK.openMain();break;
    case'hide':DK&&DK.setPetVisible&&DK.setPetVisible(false);break;
    case'quit':DK&&DK.quit&&DK.quit();break;
    case'churu':await feed('churu');break;
    case'pill':await givePill();break;
    case'kibble':await feed('kibble');break;
    case'play':{const ok=await play();if(ok&&s){s.vy=-15;s.y=Math.max(s.y,1);s.fallFrom=0}break}
    case'call':openDeskPanel();break;
    case'wake':await wake();break;
    case'walk':{const on=!walkOn(id);setWalk(id,on);deskSay(id,on?'산책 간다냥~':'여기 가만히 있을게옹',2200);break}
    case'trick':if(s){if(s.sleep){deskSay(id,'쿨... 쿨... (자는 중)',2000);break}deskDo(id,pickAct(s,true));if(s.mine&&S.cats[id])catTx(id,c=>{bumpTr(c,{trick:1})})}break;
    case'fpet':friendPet(id);break;
    case'gift':await gift(id);break;
    case'talk':{if(!s)break;const el=document.querySelector(`.dcat[data-v="${id}"]`);if(!el)break;
      const m=document.createElement('div');m.id='dmenu';m.innerHTML=`<p>${esc(s.name)}에게 뭐라고 할까요?</p>`+TALK_QUICK.map(q=>`<button data-a="dtalk" data-id="${id}" data-v="${esc(q)}">${esc(q)}</button>`).join('');
      document.body.appendChild(m);m.style.left=clamp(s.x+el.offsetWidth/2-95,8,window.innerWidth-200)+'px';m.style.bottom=(s.y+el.offsetHeight*.75)+'px';deskMenu={id};setThrough();setFull(true);break}
    case'foods':{if(!s)break;const el=document.querySelector(`.dcat[data-v="${id}"]`);if(!el)break;const inv=(me()&&me().inv)||{};
      const m=document.createElement('div');m.id='dmenu';m.innerHTML=`<p>${esc(s.name)}에게 간식 선물</p>`+GIFT_FOODS.map(k=>`<button data-a="dgift" data-id="${id}" data-v="${k}" ${inv[k]?'':'disabled'}>${ITEMS[k].n}<small>${inv[k]||0}개</small></button>`).join('');
      document.body.appendChild(m);m.style.left=clamp(s.x+el.offsetWidth/2-95,8,window.innerWidth-200)+'px';m.style.bottom=(s.y+el.offsetHeight*.75)+'px';deskMenu={id};setThrough();setFull(true);break}
    case'acts':case'flowers':{if(!s)break;const el=document.querySelector(`.dcat[data-v="${id}"]`);if(!el)break;
      const NAMES={roll:'구르기',lie:'뒹굴기',cute:'애교 부리기',angry:'화내기',stretch:'기지개 켜기',jump:'점프'};
      const inv=(me()&&me().inv)||{},b=bondInfo(myBond(S.cats[id]));
      const m=document.createElement('div');m.id='dmenu';
      m.innerHTML=a==='acts'?`<p>${esc(s.name)}에게 시킬 동작</p>`+Object.keys(NAMES).map(k=>`<button data-a="dact" data-id="${id}" data-v="${k}">${NAMES[k]}</button>`).join('')
        :`<p>꽃 선물 · 친밀도 ${b.pts} (${b.name})</p>`+FLOWER_IDS.map(f=>{const it=ITEMS[f],ok=b.pts>=it.need&&(inv[f]||0)>0;return`<button data-a="dflower" data-id="${id}" data-v="${f}" ${ok?'':'disabled'}>${it.n}<small>${(inv[f]||0)}개${b.pts>=it.need?'':' · '+it.need+'점부터'}</small></button>`}).join('');
      document.body.appendChild(m);m.style.left=clamp(s.x+el.offsetWidth/2-95,8,window.innerWidth-200)+'px';m.style.bottom=(s.y+el.offsetHeight*.75)+'px';deskMenu={id};setThrough();setFull(true);break}
    case'sendhome':if(s){deskSay(id,pick(['안녕~ 또 올게!','집에 갈게옹','재밌었다냥!']),1500);const k=s.owner;setTimeout(()=>deskCall(k,false),1300)}break;
  }
}
if(PET){
  document.addEventListener('mousemove',e=>{const o=!!e.target.closest('.dcat,#dmenu,#dpanel');if(o!==deskOver){deskOver=o}setThrough()});
  document.addEventListener('mouseleave',()=>{deskOver=false;setThrough()});
  document.addEventListener('dblclick',e=>{if(e.target.closest('.dcat'))DK&&DK.openMain()});
  document.addEventListener('pointerdown',e=>{if(e.target.closest('.dcat,#dmenu,#dpanel'))deskTouched()},true);
  document.addEventListener('contextmenu',e=>{e.preventDefault();const el=e.target.closest('.dcat');if(el)openDeskMenu(el.dataset.v)});
  document.addEventListener('pointerdown',e=>{
    if(deskMenu&&!e.target.closest('#dmenu')){closeDeskMenu();if(!e.target.closest('.dcat'))return}
    if(deskPanel&&!e.target.closest('#dpanel')&&!e.target.closest('.dcat')){closeDeskPanel();return}
    const el=e.target.closest('.dcat');if(!el||e.button!==0)return;
    const s=DS[el.dataset.v];if(!s||s.away)return;
    deskDrag={el,s,id:el.dataset.v,x0:e.clientX,y0:e.clientY,offX:e.clientX-s.x,offB:(window.innerHeight-e.clientY)-s.y,moved:false,lx:e.clientX,ly:e.clientY,lt:now(),vx:0,vy:0};
    try{el.setPointerCapture(e.pointerId)}catch(_){}
    setThrough();setFull(true);
  });
  document.addEventListener('pointermove',e=>{
    const d=deskDrag;if(!d)return;
    if(!d.moved&&Math.hypot(e.clientX-d.x0,e.clientY-d.y0)>6){d.moved=true;d.s.held=true;d.s.vy=0;d.s.vx=0;d.s.arriving=false;deskSay(d.id,pick((PT[d.s.ptype]||PT.aloof).lift),1800);if(d.s.mine){const c=S.cats[d.id];if(c)catTx(d.id,c=>{bumpTr(c,{carry:1})})}}
    if(d.moved){const W=window.innerWidth,H=window.innerHeight,w=d.el.offsetWidth,h=d.el.offsetHeight;
      d.s.x=clamp(e.clientX-d.offX,0,W-w);d.s.y=clamp((H-e.clientY)-d.offB,0,H-h);
      const dt=Math.max(8,now()-d.lt);d.vx=(e.clientX-d.lx)/dt*16;d.vy=(e.clientY-d.ly)/dt*16;d.lx=e.clientX;d.ly=e.clientY;d.lt=now()}
  });
  const endDrag=()=>{const d=deskDrag;if(!d)return;deskDrag=null;
    if(d.moved){d.s.held=false;d.s.fallFrom=d.s.y;d.s.vx=clamp(d.vx,-22,22);d.s.vy=clamp(d.vy,-22,22);if(d.s.y<=0&&d.s.vy<=0)d.s.vy=0;deskSuppress=now()+350}
    setThrough()};
  document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
  window.addEventListener('resize',()=>renderDesk());
  window.addEventListener('storage',e=>{if(e.key==='nyang-session')location.reload()});
  try{if('Notification'in window&&Notification.permission==='default')Notification.requestPermission()}catch(e){}
  requestAnimationFrame(deskLoop);setTimeout(deskChatter,15e3);setTimeout(deskNotify,20e3);
}

if(!PET){let visStart=0,lastNag=0;
  setInterval(()=>{if(S.screen!=='app'||!S.me)return;const vis=document.visibilityState==='visible'&&(!DK||document.hasFocus());if(!vis){visStart=0;return}if(!visStart)visStart=now();
    if(now()-visStart>=20*MIN&&now()-lastNag>=20*MIN){lastNag=now();const m=pick(WORK_LINES);say(m);const c=activeCat();toast(`${c?c.name:'냥이'}: "${m}"`,4500)}},30e3)}
/* ================= boot ================= */
const style=document.createElement('style');style.textContent='.tail{animation:wag 2.6s ease-in-out infinite}@keyframes wag{50%{transform:rotate(9deg)}}.blink{transform-origin:100px 93px;animation:blink 5s infinite}.fxa,.fxs,.fxf,.fxp{transform-box:fill-box;transform-origin:center}.fxa{animation:fxa 3.2s ease-in-out infinite}@keyframes fxa{0%{transform:translateY(8px);opacity:0}30%{opacity:1}100%{transform:translateY(-16px);opacity:0}}.fxs{animation:fxs 1.8s ease-in-out infinite}@keyframes fxs{0%,100%{opacity:.25;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}.fxf{animation:fxf 4s linear infinite}@keyframes fxf{0%{transform:translate(0,-10px) rotate(0);opacity:0}15%{opacity:1}100%{transform:translate(-16px,60px) rotate(170deg);opacity:0}}.fxp{animation:fxp 2.6s ease-in-out infinite}@keyframes fxp{50%{opacity:.5}}@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}';document.head.appendChild(style);
await seedDemo();
if(S.session){const u=await Store.get('users/'+S.session.key);if(u&&u.pin===S.session.pin){S.me=S.session.key;S.screen='app';render();subscribe()}else{logout()}}
else render();
})();
</script>
