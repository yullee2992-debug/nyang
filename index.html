<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리 냥이마을</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#ffb3c6">
<meta name="description" content="친구들과 함께 각자의 고양이를 키우는 냥이마을">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="냥이마을">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* layout: one phone-width app column — sticky header, scene card, controls, fixed bottom tab bar; a single pastel "cozy room" look */
:root{
  --bg:#e7f3ef;      /* mint wall of the village */
  --paper:#ffffff;
  --ink:#3b3346;     /* plum ink */
  --muted:#857c8f;
  --line:#d9e8e3;
  --pink:#ff8fab;
  --pink-d:#e0607f;
  --pink-l:#ffe3ea;
  --teal:#4fae9c;
  --teal-l:#d7f0ea;
  --gold:#f2b33d;
  --gold-l:#fff1cf;
  --sky:#d6ecf8;
  --hunger:#f4a259; --mood:#ff8fab; --clean:#6cbfe8; --energy:#8bcf6a;
  --display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font-family:var(--display);font-size:15px;color:var(--ink);cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
input{font-family:var(--body);font-size:16px;color:var(--ink)}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
.app{max-width:560px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px 10px}
.top .ttl{flex:1;min-width:0}
.top h1{font-size:1.32rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{font-size:.8em;color:var(--muted)}
.top .sub{font-size:.82rem;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.coin{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;font-family:var(--display);font-size:1rem}
.coin i{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe08a,var(--gold) 60%,#c98c1c);display:inline-block;box-shadow:inset 0 0 0 2px #e3a227}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--paper);border:1.5px solid var(--line);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}

/* scene */
.scene{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:4/3;max-height:52vh;width:100%;background:var(--sky);border:2px solid #fff;box-shadow:0 6px 0 rgba(59,51,70,.06)}
.scene>svg.bg{position:absolute;inset:0;width:100%;height:100%}
.catwrap{position:absolute;bottom:4%;left:50%;width:44%;max-width:240px;transform:translateX(-50%);transition:left 2.4s ease-in-out;cursor:pointer;touch-action:manipulation}
.catwrap .flip{transition:transform .3s}
.catwrap svg{display:block;width:100%;height:auto;animation:breathe 3.2s ease-in-out infinite;transform-origin:50% 95%}
@keyframes breathe{50%{transform:scale(1.015,.985)}}
.bubble{position:absolute;left:50%;bottom:100%;transform:translate(-50%,-2px);background:#fff;border-radius:14px;padding:6px 12px;font-family:var(--display);font-size:.92rem;white-space:nowrap;box-shadow:0 3px 0 rgba(59,51,70,.08);pointer-events:none}
.bubble::after{content:"";position:absolute;left:50%;top:100%;border:7px solid transparent;border-top-color:#fff;transform:translateX(-50%)}
.zz{position:absolute;right:8%;top:6%;font-family:var(--display);color:#6a6aa8;font-size:1.4rem;animation:zz 2.4s ease-in-out infinite}
@keyframes zz{50%{transform:translateY(-8px);opacity:.6}}
.heart{position:absolute;pointer-events:none;width:22px;height:22px;animation:heart 1s ease-out forwards}
@keyframes heart{from{transform:translateY(0) scale(.6);opacity:1}to{transform:translateY(-70px) scale(1.2);opacity:0}}
.scene .hint{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.85);border-radius:999px;padding:4px 10px;font-size:.78rem;color:var(--muted)}
.switcher{display:flex;gap:8px;overflow-x:auto;padding-block:2px 10px}
.switcher button{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:3px 12px 3px 3px;font-size:.88rem}
.switcher button.on{border-color:var(--pink);background:var(--pink-l)}
.switcher svg{width:30px;height:30px}

/* stats */
.panel{background:var(--paper);border-radius:20px;padding:14px;border:1.5px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:12px;padding-block:4px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.stat label{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);margin-bottom:4px}
.stat label b{font-family:var(--display);font-weight:400;color:var(--ink)}
.bar{height:10px;border-radius:99px;background:#eef2f1;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .5s}
.bar.low i{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.5}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.78rem;padding:3px 10px;border-radius:999px;background:var(--teal-l);color:#2b6f62;letter-spacing:.02em}
.chip.pink{background:var(--pink-l);color:#b2415f}
.chip.gold{background:var(--gold-l);color:#8a5a00}
.chip.gray{background:#eef0f2;color:#5f6670}
.meta{display:flex;flex-direction:column;gap:8px}
.xp{display:flex;align-items:center;gap:10px;font-size:.82rem;color:var(--muted)}
.xp .bar{flex:1;height:7px}
.grow{font-size:.8rem;color:var(--muted)}

/* actions */
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.act{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;border-radius:16px;background:var(--paper);border:1.5px solid var(--line);font-size:.86rem;position:relative}
.act span.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.act span.ic svg{width:22px;height:22px}
.act small{font-family:var(--body);font-size:.68rem;color:var(--muted);position:absolute;top:4px;right:6px}
.act:not(:disabled):active{transform:translateY(2px)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(255,255,255,.96);border-top:1.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;font-size:.78rem;color:var(--muted);position:relative}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--pink-d)}
.dot{position:absolute;top:6px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--pink-d);border:2px solid #fff}

/* sheets & toast */
.backdrop{position:fixed;inset:0;background:rgba(40,32,52,.38);z-index:40;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:560px;max-height:88vh;overflow:auto;z-index:41;background:var(--paper);border-radius:24px 24px 0 0;padding-block:8px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));animation:up .25s ease-out}
@keyframes up{from{transform:translate(-50%,40px);opacity:.4}}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:#e3e3ea;margin:4px auto 12px}
.sheet h2{font-size:1.3rem;margin-bottom:4px}
.sheet .lead{color:var(--muted);font-size:.88rem;margin:0 0 12px;line-height:1.55}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-family:var(--display);font-size:.95rem;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.18);animation:fade .2s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:14px;padding:11px 18px;background:var(--pink);color:#fff;font-size:1rem;box-shadow:0 3px 0 var(--pink-d)}
.btn.teal{background:var(--teal);box-shadow:0 3px 0 #368a7a}
.btn.ghost{background:var(--paper);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.small{padding:7px 12px;font-size:.88rem;border-radius:11px}
.btn.block{width:100%}
.btn:not(:disabled):active{transform:translateY(2px);box-shadow:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;border:1.5px solid var(--line);background:var(--paper)}
.item .tx{flex:1;min-width:0}
.item .tx b{font-family:var(--display);font-weight:400;font-size:1rem;display:block}
.item .tx span{font-size:.8rem;color:var(--muted)}
.thumb{width:52px;height:52px;flex:0 0 52px;border-radius:14px;background:var(--pink-l);display:grid;place-items:center;overflow:hidden}
.thumb svg{width:100%;height:100%}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px}
.tabs button{flex:0 0 auto;padding:7px 14px;border-radius:999px;background:var(--paper);border:1.5px solid var(--line);font-size:.9rem}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* shop */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:6px}
.card .pic{aspect-ratio:1;border-radius:14px;background:linear-gradient(180deg,#fff6f8,#fde7ee);display:grid;place-items:center;overflow:hidden}
.card .pic svg{width:86%;height:86%}
.card b{font-family:var(--display);font-weight:400;font-size:1rem}
.card .d{font-size:.75rem;color:var(--muted);line-height:1.45;min-height:2.2em}
.price{display:flex;align-items:center;justify-content:space-between;gap:6px}
.price span{font-family:var(--display);display:inline-flex;align-items:center;gap:4px}
.price span i{width:14px;height:14px;border-radius:50%;background:var(--gold);display:inline-block;box-shadow:inset 0 0 0 2px #e3a227}

/* plaza */
.plaza{position:relative;border-radius:22px;overflow:hidden;width:100%;aspect-ratio:1/1;max-height:62vh;border:2px solid #fff}
.plaza>svg.bg{position:absolute;inset:0;width:100%;height:100%}
.pcat{position:absolute;width:22%;max-width:120px;transform:translate(-50%,-100%);transition:left 3.5s linear,top 3.5s linear;cursor:pointer;text-align:center}
.pcat .flip{transition:transform .3s}
.pcat svg{width:100%;height:auto;display:block}
.tag{display:inline-block;margin-top:-4px;background:rgba(255,255,255,.92);border-radius:999px;padding:2px 8px;font-size:.68rem;font-family:var(--display);white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.tag i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#c3c3cc;margin-right:4px;vertical-align:1px}
.tag i.on{background:#3cc46b}
.online{font-size:.82rem;color:var(--muted)}

/* gate & creator */
.gate{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:18px;padding-block:28px}
.gate .hero{width:min(260px,70%);margin:0 auto}
.gate h1{font-size:2.2rem;text-align:center;color:var(--pink-d)}
.gate p{text-align:center;color:var(--muted);margin:0;line-height:1.6}
.mode{font-size:.8rem;background:var(--gold-l);color:#7a5200;border-radius:14px;padding:10px 12px;line-height:1.55}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.85rem;color:var(--muted)}
.field input{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;width:100%}
.err{color:#c43d5c;font-size:.85rem;min-height:1.2em}
.creator .preview{background:linear-gradient(180deg,#fff,#fde9ef);border-radius:22px;border:2px solid #fff;display:grid;place-items:center;padding:10px;position:relative}
.creator .preview svg{width:min(240px,62%);height:auto}
.creator .preview .rand{position:absolute;right:10px;top:10px}
.opt h3{font-size:.95rem;margin:4px 0 8px;color:var(--muted)}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.sw button.on{box-shadow:0 0 0 3px var(--pink-d)}
.sw label.custom{width:38px;height:38px;border-radius:50%;box-shadow:0 0 0 1.5px var(--line);background:conic-gradient(red,orange,yellow,lime,cyan,blue,magenta,red);position:relative;overflow:hidden;cursor:pointer}
.sw label.custom input{position:absolute;inset:0;opacity:0;cursor:pointer}
.ch{display:flex;flex-wrap:wrap;gap:8px}
.ch button{padding:8px 14px;border-radius:999px;background:var(--paper);border:1.5px solid var(--line);font-size:.92rem}
.ch button.on{background:var(--pink);border-color:var(--pink);color:#fff}

/* minigames */
.game{position:relative;width:100%;aspect-ratio:4/3;max-height:46vh;border-radius:18px;background:repeating-linear-gradient(90deg,#f6efe4 0 26px,#efe5d6 26px 52px);overflow:hidden;touch-action:manipulation}
.laser{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:radial-gradient(circle,#fff 0 18%,#ff3b5c 30%,rgba(255,59,92,.25) 62%,transparent 70%);transition:left .55s ease-out,top .55s ease-out;cursor:pointer}
.gstat{display:flex;justify-content:space-between;font-family:var(--display);margin:8px 2px}
.meter{position:relative;height:34px;border-radius:12px;background:#f0edf4;overflow:hidden;margin:14px 0}
.meter .zone{position:absolute;top:0;bottom:0;background:#9fe0b0}
.meter .mk{position:absolute;top:-2px;bottom:-2px;width:6px;margin-left:-3px;background:var(--ink);border-radius:3px}
.cmd{font-family:var(--display);font-size:2rem;text-align:center;color:var(--pink-d);margin-top:6px}
.feed{display:flex;flex-direction:column}
.feed div{display:flex;gap:10px;padding:10px 2px;border-bottom:1px dashed var(--line);font-size:.9rem;line-height:1.5}
.feed time{color:var(--muted);font-size:.75rem;flex:0 0 52px;padding-top:2px}
.empty{text-align:center;color:var(--muted);padding:28px 10px;line-height:1.6}
.sect{font-family:var(--display);font-size:1.05rem;margin:6px 2px 2px}

/* desktop pet mode (Electron transparent strip above the taskbar) */
html.pet,html.pet body{background:transparent!important;overflow:hidden;height:100%}
html.pet body::before{display:none}
html.pet .app{max-width:none;padding:0;min-height:0}
#desk{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.dcat{position:absolute;left:0;bottom:0;width:124px;pointer-events:auto;cursor:pointer;will-change:transform;touch-action:manipulation}
.dcat.friend{width:96px}
.dcat .body{transform-origin:50% 100%}
.dcat.walk .body{animation:hop .52s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-4px) rotate(1.2deg)}}
.dcat .flip{transition:transform .25s}
.dcat .flip svg{display:block;width:100%;height:auto;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}
.dcat .bubble{white-space:normal;width:max-content;max-width:230px;text-align:center;line-height:1.4;font-size:.86rem;bottom:92%;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.dcat .nm{position:absolute;left:50%;bottom:0;transform:translateX(-50%);font-family:var(--display);font-size:11px;background:rgba(255,255,255,.9);border-radius:9px;padding:0 7px;white-space:nowrap;color:var(--ink)}
.dcat .zz{right:0;top:-6px;font-size:1.1rem}
.dcat .heart{width:20px;height:20px}
#dmenu{position:fixed;z-index:50;width:190px;background:#fff;border-radius:14px;padding:6px;box-shadow:0 10px 28px rgba(40,30,60,.28);pointer-events:auto;animation:fade .12s}
#dmenu p{margin:4px 10px 6px;font-family:var(--display);color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dmenu button{display:flex;width:100%;align-items:center;justify-content:space-between;text-align:left;padding:8px 10px;border-radius:9px;font-size:.95rem}
#dmenu button small{font-family:var(--body);font-size:.75rem;color:var(--muted)}
#dmenu button:hover,#dmenu button:focus-visible{background:var(--pink-l)}
#dmenu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
#dpanel{position:fixed;z-index:50;left:50%;transform:translateX(-50%);bottom:180px;width:min(380px,92vw);max-height:calc(100vh - 200px);overflow:auto;background:#fff;border-radius:20px;padding:16px;box-shadow:0 12px 34px rgba(40,30,60,.3);pointer-events:auto;animation:fade .15s}
#dpanel h3{font-size:1.2rem}
.dcat{cursor:grab}.dcat.held{cursor:grabbing}
.dcat.held .body{animation:dangle .7s ease-in-out infinite;transform-origin:50% 12%}
@keyframes dangle{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.dcat.squash .body{animation:squash .4s ease-out}
@keyframes squash{30%{transform:scale(1.2,.75)}70%{transform:scale(.94,1.07)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:640px){.actions{gap:10px}}
</style>
</head>
<body>
<div id="root" class="app"></div>
<div id="layer"></div>
<script src="config.js"></script>
<script>
(async()=>{
'use strict';
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const DAY=864e5,HOUR=36e5,MIN=6e4;
const now=()=>Date.now();
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const kstDay=t=>new Date((t||now())+9*HOUR).toISOString().slice(0,10);
const ownerKey=n=>n.trim().toLowerCase().replace(/[.$#\[\]\/\s]/g,'_');
function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255]}
const toHex=(r,g,b)=>'#'+[r,g,b].map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join('');
function shade(h,a){const[r,g,b]=hexToRgb(h);return a<0?toHex(r*(1+a),g*(1+a),b*(1+a)):toHex(r+(255-r)*a,g+(255-g)*a,b+(255-b)*a)}
function mix(a,b){const x=hexToRgb(a),y=hexToRgb(b);return toHex((x[0]+y[0])/2,(x[1]+y[1])/2,(x[2]+y[2])/2)}
function lum(h){const[r,g,b]=hexToRgb(h);return(0.299*r+0.587*g+0.114*b)/255}
async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return'x'+h}}
function ago(t){const d=now()-t;if(d<MIN)return'방금';if(d<HOUR)return Math.floor(d/MIN)+'분 전';if(d<DAY)return Math.floor(d/HOUR)+'시간 전';return Math.floor(d/DAY)+'일 전'}

function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
function LocalStore(){
  const KEY='nyang-demo-db';let root={};
  const read=()=>{try{root=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){root=root||{}}};read();
  const subs=new Set();let bc=null;try{bc=new BroadcastChannel('nyang-demo')}catch(e){}
  let pend=false;
  const notify=()=>{if(pend)return;pend=true;setTimeout(()=>{pend=false;for(const s of subs)s.cb(clone(getP(s.path)))},0)};
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(root))}catch(e){}try{bc&&bc.postMessage(1)}catch(e){}notify()};
  if(bc)bc.onmessage=()=>{read();notify()};
  window.addEventListener('storage',e=>{if(e.key===KEY){read();notify()}});
  const parts=p=>p.split('/').filter(Boolean);
  const getP=p=>{let o=root;for(const k of parts(p)){if(o==null||typeof o!=='object')return null;o=o[k]}return o===undefined?null:o};
  const setP=(p,v)=>{const ks=parts(p);let o=root;for(let i=0;i<ks.length-1;i++){if(typeof o[ks[i]]!=='object'||o[ks[i]]===null)o[ks[i]]={};o=o[ks[i]]}const l=ks[ks.length-1];if(v===null||v===undefined)delete o[l];else o[l]=clone(v)};
  return{mode:'local',
    get:async p=>clone(getP(p)),
    set:async(p,v)=>{setP(p,v);save()},
    update:async obj=>{for(const k in obj)setP(k,obj[k]);save()},
    push:async(p,v)=>{const k=Date.now().toString(36).padStart(10,'0')+Math.random().toString(36).slice(2,6);setP(p+'/'+k,v);save();return k},
    on:(p,cb)=>{const s={path:p,cb};subs.add(s);setTimeout(()=>cb(clone(getP(p))),0);return()=>subs.delete(s)},
    tx:async(p,fn)=>{const r=fn(clone(getP(p)));if(r===undefined)return{committed:false};setP(p,r);save();return{committed:true,value:clone(r)}},
    reset:()=>{root={};save()}
  };
}
function FirebaseStore(cfg){
  firebase.initializeApp(cfg);const db=firebase.database();
  return{mode:'firebase',
    get:async p=>(await db.ref(p).get()).val(),
    set:(p,v)=>db.ref(p).set(clone(v)),
    update:obj=>db.ref().update(clone(obj)),
    push:async(p,v)=>{const r=db.ref(p).push();await r.set(clone(v));return r.key},
    on:(p,cb,lim)=>{const q=lim?db.ref(p).limitToLast(lim):db.ref(p);const h=s=>cb(s.val());q.on('value',h);return()=>q.off('value',h)},
    tx:async(p,fn)=>{const r=await db.ref(p).transaction(cur=>{const o=fn(cur);return o===undefined?undefined:clone(o)});return{committed:r.committed,value:r.snapshot.val()}}
  };
}

function defaultP(pat,coat){return pat==='tuxedo'||pat==='belly'?'#f8f5f0':pat==='calico'?'#f2a950':pat==='point'?'#5f4030':shade(coat,lum(coat)>.5?-.32:.35)}
function newCat(owner,name,look,extra){

function norm(c){if(!c)return c;c.st=c.st||{hunger:50,mood:50,clean:50,energy:50};c.eq=c.eq||{};c.cd=c.cd||{};c.look=c.look||randomLook();for(const k of['aff','smart','strong','neglect','xp'])c[k]=c[k]||0;c.lv=c.lv||1;return c}
function tick(c,t){
  norm(c);
  if(c.status==='runaway'){
    if(c.searchUntil&&t>=c.searchUntil){c.status='home';c.st={hunger:35,mood:35,clean:25,energy:50};c.aff=clamp(c.aff-10);c.neglect=0;c.lastUpdate=c.searchUntil;c.searchUntil=null;c.returned=true}
    else{c.lastUpdate=t;return c}
  }
  let x=c.lastUpdate||t;
  while(x<t){
    const sl=c.sleepUntil&&x<c.sleepUntil;const dt=Math.max(1,Math.min(10*MIN,t-x,sl?c.sleepUntil-x:Infinity)),h=dt/HOUR;
    const s=c.st;
    s.hunger=clamp(s.hunger-(sl?2.5:5)*h);
    s.clean=clamp(s.clean-2*h);
    let md=sl?.5:3;if(s.hunger<20)md+=3;if(s.clean<20)md+=2;
    s.mood=clamp(s.mood-md*h);
    s.energy=clamp(s.energy+(sl?3000:-100)*h);
    if(s.hunger<15&&s.mood<20){c.neglect+=h;c.aff=clamp(c.aff-.6*h)}
    x+=dt;
    if(c.neglect>=24){c.status='runaway';c.runawayAt=x;c.sleepUntil=null;break}
  }
  c.lastUpdate=t;return c;
}

/* ================= subscriptions ================= */
function subscribe(){
  S.subs.forEach(f=>f());S.subs=[];
  let first={users:0,cats:0};
  S.subs.push(Store.on('users',v=>{S.users=v||{};first.users=1;onData()}));
  S.subs.push(Store.on('cats',v=>{S.cats={};for(const k in(v||{}))S.cats[k]=norm(v[k]);first.cats=1;onData()}));
  S.subs.push(Store.on('proposals',v=>{S.props=v||{};onData()}));
  S.subs.push(Store.on('feed',v=>{S.feed=Object.entries(v||{}).map(([k,x])=>Object.assign({k},x)).sort((a,b)=>a.at-b.at).slice(-60);onData()},60));
  let booted=false;
  function onData(){
    if(!booted&&first.users&&first.cats){booted=true;afterLogin()}
    if(S.screen==='app'&&first.users){if(!me()){logout();return}schedule()}
  }
}
let rq=0;function schedule(){if(rq)return;rq=requestAnimationFrame(()=>{rq=0;render()})}
async function afterLogin(){
  const u=me();if(!u){logout();toast('주인 정보를 찾지 못했어요. 다시 들어와 주세요.');return}
  S.screen='app';render();
  // daily bonus
  const d=kstDay();
  if(u.lastDaily!==d){const r=await Store.tx('users/'+S.me,x=>{if(!x)return x;if(x.lastDaily===d)return;x.lastDaily=d;x.coins=(x.coins||0)+300;return x});if(r.committed)toast('출석 보상 300코인을 받았어요!')}
  // persist decay
  for(const c of myCats())await Store.tx('cats/'+c.id,x=>{if(!x)return x;return roundCat(tick(norm(x),now()))});
  heartbeat();
}
let hbT=0;function heartbeat(){clearInterval(hbT);const f=()=>{if(S.me&&document.visibilityState==='visible')Store.set('users/'+S.me+'/seen',now())};f();hbT=setInterval(f,60e3)}
setInterval(()=>{if(S.screen==='app'&&!document.querySelector('.sheet [data-live]'))schedule()},20e3);

async function register(owner,pin,catName,look){
  const key=ownerKey(owner);
  if(!key)throw'주인이름을 적어주세요.';
  if(key.startsWith('demo-'))throw'다른 주인이름을 써주세요.';
  const ex=await Store.get('users/'+key);
  if(ex)throw'이미 있는 주인이름이에요. 다른 이름을 쓰거나 "이미 고양이가 있어요"로 들어와 주세요.';
  const pinH=await sha('nyang:'+key+':'+pin);
  const c=newCat(key,catName,look);
  await Store.update({['users/'+key]:{name:owner.trim(),pin:pinH,coins:500,inv:{churu:3,smelt:2},main:c.id,active:c.id,room:{bg:'basic'},created:now(),seen:now()},['cats/'+c.id]:c});
  await Store.push('feed',{at:now(),text:`${owner.trim()}님이 새 가족 ${c.name}${josa(c.name,'을','를').slice(-1)} 데려왔어요.`,by:key});
  setSession(key,pinH);
}
async function login(owner,pin){
  const key=ownerKey(owner);const u=await Store.get('users/'+key);
  if(!u)throw'그런 주인이름이 없어요. 철자를 확인하거나 새 고양이를 데려와 주세요.';
  const pinH=await sha('nyang:'+key+':'+pin);
  if(u.pin!==pinH)throw'비밀번호 4자리가 맞지 않아요.';
  setSession(key,pinH);
}
function setSession(key,pin){S.session={key,pin};try{localStorage.setItem('nyang-session',JSON.stringify(S.session))}catch(e){}S.me=key;subscribe();if(DK&&!PET)DK.sessionChanged()}
function logout(){S.subs.forEach(f=>f());S.subs=[];S.me=null;S.session=null;try{localStorage.removeItem('nyang-session')}catch(e){}S.screen='gate';closeSheet();render();if(DK&&!PET)DK.sessionChanged()}

/* ================= actions ================= */
async function catTx(id,fn){
  let res=null;
  const r=await Store.tx('cats/'+id,c=>{if(!c)return c;norm(c);tick(c,now());res={};const out=fn(c,res);if(out===false){return}const g=tryGrow(c);if(g)res.grew=g;return roundCat(c)});
  if(!r.committed||!res)return res&&res.msg?(toast(res.msg),null):null;
  if(res.coins)await addCoins(res.coins);
  if(res.grew){const c=S.cats[id]||r.value;toast(`${c.name}${iGa(c.name).slice(-1)} ${josa(res.grew,'으로','로')} 자랐어요!`,3200);log(`${title(r.value)}${iGa(r.value.name).slice(-1)} ${josa(res.grew,'으로','로')} 자랐어요!`)}
  if(res.ups)toast(`레벨 업! Lv.${r.value.lv} · 보너스 ${res.lvCoins}코인`,2600);
  return res;
}
const addCoins=n=>Store.tx('users/'+S.me+'/coins',v=>Math.max(0,(v||0)+n));
async function useItem(id,n=1){const r=await Store.tx('users/'+S.me+'/inv/'+id,v=>{if((v||0)<n)return;return(v||0)-n});return r.committed}
function xp(c,res,n){const r=addXP(c,n);if(r.ups){res.ups=r.ups;res.lvCoins=r.coins;res.coins=(res.coins||0)+r.coins}}
function busy(c){if(c.status==='runaway')return'가출 중이에요';if(c.sleepUntil&&c.sleepUntil>now())return'쿨쿨 자는 중이에요';return null}

let lastPet=0;
async function pet(ev){
  const c=activeCat();if(!c)return;
  const t=now();if(t-lastPet<350)return;lastPet=t;
  const v=live(c);
  spawnHeart(ev);
  if(v.sleepUntil&&v.sleepUntil>t){say('쿨... 쿨...');return}
  const res=await catTx(c.id,(c,res)=>{
    const d=kstDay();if(c.petDay!==d){c.petDay=d;c.petN=0}
    if(c.st.mood<25&&Math.random()<.4){res.msg='하악! 지금은 삐졌어요';res.refuse=true;return}
    c.petN++;c.st.mood=clamp(c.st.mood+3);c.neglect=0;
    if(c.petN<=40){c.aff=clamp(c.aff+.4);if(c.petN%3===0)res.coins=2}
    if(c.petN%10===0)xp(c,res,2);
  });
  if(res&&res.refuse){say('하악!');return}
  S.happyUntil=now()+900;say(pick(['골골골...','냐아~','더 해줘옹','기분 좋다냥','그르릉']));schedule();
}
function spawnHeart(ev){
  const sc=PET?(ev&&ev.target&&ev.target.closest('.dcat')):$('.scene');if(!sc)return;const r=sc.getBoundingClientRect();
  const x=(ev&&ev.clientX?ev.clientX:r.left+r.width/2)-r.left,y=(ev&&ev.clientY?ev.clientY:r.top+r.height*.6)-r.top;
  const h=document.createElement('div');h.className='heart';h.style.left=(x-11+rnd(-10,10))+'px';h.style.top=(y-20)+'px';h.innerHTML=heartSVG;sc.appendChild(h);setTimeout(()=>h.remove(),1000);
}
function say(t){if(PET){const c=activeCat();if(c)deskSay(c.id,t,2600);return}S.bubble={t,until:now()+2600};const b=$('.bubble');if(b){b.textContent=t;b.hidden=false}setTimeout(()=>{if(S.bubble&&S.bubble.until<=now()){const b=$('.bubble');if(b)b.hidden=true}},2700)}

const FOOD={kibble:{h:25,m:0,a:0,x:2},churu:{h:10,m:20,a:2,x:3},fish:{h:45,m:5,a:.5,x:4},smelt:{h:30,m:12,a:1,x:4},cake:{h:20,m:35,a:1,x:5}};
async function feed(kind){
  const c=activeCat();if(!c)return;const v=live(c);const b=busy(v);if(b)return toast(b);
  if(v.st.hunger>=92&&kind!=='churu'&&kind!=='cake')return toast('배불러서 더 못 먹어요');
  if(kind!=='kibble'&&!(await useItem(kind)))return toast(`${ITEMS[kind].n}${iGa(ITEMS[kind].n).slice(-1)} 없어요. 상점에서 살 수 있어요`);
  const f=FOOD[kind];
  await catTx(c.id,(c,res)=>{c.st.hunger=clamp(c.st.hunger+f.h);c.st.mood=clamp(c.st.mood+f.m);c.aff=clamp(c.aff+f.a);c.neglect=0;xp(c,res,f.x)});
  closeSheet();S.happyUntil=now()+1200;say(kind==='smelt'?'오독오독 열빙어!':kind==='churu'?'츄르 최고냥!!':kind==='cake'?'생일도 아닌데?!':'냠냠냠');schedule();
}
async function play(){
  const c=activeCat();if(!c)return;const v=live(c);const b=busy(v);if(b)return toast(b);
  if(v.cd.play>now())return toast(`조금 쉬었다 놀아요 (${dur(v.cd.play-now())})`);
  if(v.st.energy<5)return toast('기력이 없어요. 낮잠을 재워주세요 (2분이면 가득 차요)');
  await catTx(c.id,(c,res)=>{c.st.mood=clamp(c.st.mood+15);c.st.hunger=clamp(c.st.hunger-5);c.st.energy=clamp(c.st.energy-5);c.aff=clamp(c.aff+1);c.neglect=0;c.cd.play=now()+1*MIN;res.coins=15;xp(c,res,8)});
  S.happyUntil=now()+1500;say(pick(['털실 잡았다!','한 번 더!','우다다다']));toast('신나게 놀았어요 · 15코인');schedule();return true;
}
async function bath(){
  const c=activeCat();if(!c)return;const v=live(c);const b=busy(v);if(b)return toast(b);
  if(v.st.clean>85)return toast('이미 깨끗해요');
  const likes=v.aff>=60;
  await catTx(c.id,(c,res)=>{c.st.clean=100;c.st.mood=clamp(c.st.mood+(likes?5:-12));c.neglect=0;xp(c,res,3)});
  say(likes?'뽀송뽀송~':'물 싫어!!');toast(likes?'뽀송뽀송해졌어요':'깨끗해졌지만 조금 삐졌어요');schedule();
}
async function nap(){
  const c=activeCat();if(!c)return;const v=live(c);const b=busy(v);if(b)return toast(b);
  if(v.st.energy>=90)return toast('아직 안 졸려요');
  await catTx(c.id,c=>{c.sleepUntil=now()+2*MIN});toast('2분 동안 낮잠을 자요. 일어나면 기력이 가득 차요');schedule();
}
async function wake(){const c=activeCat();if(!c)return;await catTx(c.id,c=>{c.sleepUntil=null;c.st.mood=clamp(c.st.mood-3)});say('하암...');schedule()}
async function searchCat(){
  const c=activeCat();if(!c)return;
  if(!(await useItem('churu')))return toast('츄르가 1개 있어야 찾으러 갈 수 있어요. 상점에서 사 오세요');

/* ================= minigames ================= */
function checkTrain(kind){
  const c=activeCat();if(!c)return null;const v=live(c);const b=busy(v);if(b){toast(b);return null}
  const cd=v.cd[kind];if(cd>now()){toast(`다음 ${kind==='train'?'교육':'운동'}까지 ${dur(cd-now())}`);return null}
  const e=kind==='train'?8:10;if(v.st.energy<e){toast('기력이 없어요. 낮잠을 재워주세요 (2분이면 가득 차요)');return null}
  if(v.st.hunger<20){toast('배가 고파서 집중을 못 해요');return null}
  if(kind==='train'&&v.st.mood<25){toast('삐져서 말을 안 들어요. 먼저 달래주세요');return null}
  return v;
}
function exerciseGame(){
  const v=checkTrain('ex');if(!v)return;
  openSheet(`<h2>운동: 레이저 잡기</h2><p class="lead">빨간 점을 최대한 많이 눌러주세요. 12초 동안 잡은 만큼 ${esc(v.name)}${iGa(v.name).slice(-1)} 튼튼해져요.</p>
  <div class="gstat num"><span id="gh">잡은 수 0</span><span id="gt">12.0초</span></div><div class="game" id="gb" data-live="1"><div class="laser" id="lz" role="button" aria-label="레이저 점"></div></div>
  <div class="row" style="margin-top:12px"><button class="btn block" id="gs">시작</button></div>`);
  let hits=0,run=false,end=0,mv=0,tm=0;const lz=$('#lz'),gb=$('#gb');
  const move=()=>{lz.style.left=rnd(8,92)+'%';lz.style.top=rnd(10,90)+'%'};move();
  lz.addEventListener('pointerdown',e=>{e.preventDefault();if(!run)return;hits++;$('#gh').textContent='잡은 수 '+hits;move();clearInterval(mv);mv=setInterval(move,Math.max(420,800-hits*15))});
  $('#gs').onclick=()=>{if(run)return;run=true;$('#gs').disabled=true;end=now()+12e3;mv=setInterval(move,800);
    tm=setInterval(async()=>{const l=end-now();const g=$('#gt');if(!g){clearInterval(tm);clearInterval(mv);return}g.textContent=(Math.max(0,l)/1000).toFixed(1)+'초';
      if(l<=0){clearInterval(tm);clearInterval(mv);run=false;
        const gain=Math.min(8,hits/3),coins=Math.min(80,hits*5);
        const res=await catTx(v.id,(c,res)=>{c.strong=clamp(c.strong+gain);c.st.energy=clamp(c.st.energy-10);c.st.hunger=clamp(c.st.hunger-10);c.st.mood=clamp(c.st.mood+(hits>=8?6:0));c.neglect=0;c.cd.ex=now()+5*MIN;res.coins=coins;xp(c,res,5+hits)});
        gb.innerHTML=`<div class="empty" style="padding-top:18%"><h2>${hits}번 잡았어요!</h2><p>튼튼함 +${gain.toFixed(1)} · ${coins}코인</p></div>`;
        $('#gs').textContent='닫기';$('#gs').disabled=false;$('#gs').onclick=closeSheet;
      }},100)};
}
function trainGame(){
  const v=checkTrain('train');if(!v)return;
  const cmds=['앉아!','손!','기다려!','하이파이브!','빵야!','돌아!'];
  const zoneW=Math.round(14+v.smart/10+v.st.mood/20);
  openSheet(`<h2>교육: 명령 연습</h2><p class="lead">막대가 초록 칸에 들어왔을 때 "지금!"을 누르세요. 세 번 중 맞힌 만큼 똑똑해져요.</p>
  <div class="cmd" id="cm">준비</div><div class="meter" data-live="1"><div class="zone" id="zn"></div><div class="mk" id="mk"></div></div>
  <div class="gstat num"><span id="tr">1 / 3</span><span id="ok">성공 0</span></div><button class="btn block teal" id="go">시작</button>`);
  let round=0,ok=0,pos=0,dir=1,raf=0,z0=0,active=false;
  const mk=$('#mk'),zn=$('#zn');
  const setZone=()=>{z0=rnd(10,90-zoneW);zn.style.left=z0+'%';zn.style.width=zoneW+'%';$('#cm').textContent=pick(cmds)};
  const loop=()=>{if(!active)return;pos+=dir*(1.3+round*.35);if(pos>=100){pos=100;dir=-1}if(pos<=0){pos=0;dir=1}mk.style.left=pos+'%';raf=requestAnimationFrame(loop)};
  $('#go').onclick=async()=>{
    if(!active&&round===0){active=true;setZone();$('#go').textContent='지금!';loop();return}
    if(!active)return;
    const hit=pos>=z0&&pos<=z0+zoneW;if(hit)ok++;round++;
    $('#ok').textContent='성공 '+ok;$('#cm').textContent=hit?'잘했어!':'딴짓...';
    if(round>=3){active=false;cancelAnimationFrame(raf);
      const coins=ok*25;
      await catTx(v.id,(c,res)=>{c.smart=clamp(c.smart+ok*1.5);c.st.energy=clamp(c.st.energy-8);c.st.hunger=clamp(c.st.hunger-8);if(!ok)c.st.mood=clamp(c.st.mood-5);c.neglect=0;c.cd.train=now()+5*MIN;res.coins=coins;xp(c,res,6+ok*5)});
      $('#tr').textContent='끝';$('#cm').textContent=ok===3?'천재냥!':ok?`${ok}번 성공!`:'다음엔 잘할 거야';
      $('#go').textContent=`닫기 (똑똑함 +${ok*1.5} · ${coins}코인)`;$('#go').onclick=closeSheet;return}
    $('#tr').textContent=(round+1)+' / 3';active=false;setTimeout(()=>{active=true;setZone();loop()},700);
  };
}

async function buy(id){
  const it=ITEMS[id];let why='';
  const r=await Store.tx('users/'+S.me,u=>{if(!u)return u;u.inv=u.inv||{};if(!STACK.has(id)&&u.inv[id]){why='이미 갖고 있어요';return}if((u.coins||0)<it.p){why='코인이 부족해요';return}u.coins-=it.p;u.inv[id]=(u.inv[id]||0)+1;return u});
  if(!r.committed)return toast(why||'구매하지 못했어요');
  toast(`${it.n} 구매 완료!`);
}

function proposeCheck(myC,t){
  const u=me();
  if(!myC)return'대표 고양이가 없어요';
  if(t.owner===S.me)return'내 고양이에게는 청혼할 수 없어요';
  if(myC.stage!=='adult')return`${myC.name}${iGa(myC.name).slice(-1)} 아직 어른냥이 아니에요`;
  if(t.stage!=='adult')return`${t.name}${iGa(t.name).slice(-1)} 아직 어른냥이 아니에요`;
  if(myC.spouse)return`${myC.name}${eunNeun(myC.name).slice(-1)} 이미 결혼했어요`;
  if(t.spouse)return`${t.name}${eunNeun(t.name).slice(-1)} 이미 결혼했어요`;
  if(myC.aff<70)return`${myC.name}의 애정도가 70 이상이어야 해요 (지금 ${Math.floor(myC.aff)})`;
  if(t.aff<70)return`${t.name}의 애정도가 70 이상이어야 해요`;
  if(myC.status==='runaway'||t.status==='runaway')return'가출 중인 고양이가 있어요';
  if(!((u.inv||{}).ring>0))return'결혼반지가 필요해요 (상점 1,500코인)';
  if(Object.values(S.props).some(p=>p.status==='pending'&&p.from===myC.id))return'이미 보낸 청혼이 답을 기다리고 있어요';
  return null;
}
async function propose(id){
  const u=me(),myC=live(S.cats[u.main]),t=live(S.cats[id]);const why=proposeCheck(myC,t);if(why)return toast(why);
  const k=await Store.push('proposals',{from:myC.id,to:t.id,fromOwner:S.me,toOwner:t.owner,at:now(),status:'pending'});
  log(`${title(myC)}${iGa(myC.name).slice(-1)} ${title(t)}에게 청혼했어요!`);toast('청혼을 보냈어요. 상대 주인의 대답을 기다려요');closeSheet();
  if(DEMO&&String(t.owner).startsWith('demo-'))setTimeout(()=>accept(k,t.owner),2500);
}
async function accept(pid,asOwner){
  const p=S.props[pid]||await Store.get('proposals/'+pid);if(!p||p.status!=='pending')return;
  const a=live(S.cats[p.from]),b=live(S.cats[p.to]);
  if(!a||!b||a.spouse||b.spouse){await Store.set('proposals/'+pid+'/status','expired');return toast('이미 다른 고양이와 결혼했어요')}
  const r=await Store.tx('users/'+p.fromOwner+'/inv/ring',v=>{if((v||0)<1)return;return v-1});
  if(!r.committed){await Store.set('proposals/'+pid+'/status','expired');return toast('청혼한 쪽 결혼반지가 없어서 결혼할 수 없어요')}
  const t=now();
  await Store.update({[`cats/${a.id}/spouse`]:b.id,[`cats/${b.id}/spouse`]:a.id,[`cats/${a.id}/marriedAt`]:t,[`cats/${b.id}/marriedAt`]:t,[`proposals/${pid}/status`]:'accepted'});
  await Store.push('feed',{at:t,text:`${title(a)}${waGwa(a.name).slice(-1)} ${title(b)}${iGa(b.name).slice(-1)} 결혼했어요! 축하해 주세요`,by:asOwner||S.me});
  if(p.fromOwner===S.me||p.toOwner===S.me)toast(`${a.name}${waGwa(a.name).slice(-1)} ${b.name}${iGa(b.name).slice(-1)} 결혼했어요!`,3200);
}
async function decline(pid){await Store.set('proposals/'+pid+'/status','declined');const p=S.props[pid];if(p){const a=S.cats[p.from],b=S.cats[p.to];if(a&&b)log(`${title(b)}${iGa(b.name).slice(-1)} 청혼을 정중히 거절했어요.`)}toast('거절했어요')}
function babyCheck(c,sp){
  if(!c.spouse||!sp)return'결혼한 고양이만 아기를 가질 수 있어요';
  if(now()-c.marriedAt<2*DAY)return`결혼하고 2일이 지나야 해요 (${dur(c.marriedAt+2*DAY-now())} 남음)`;
  const last=Math.max(c.lastBabyAt||0,sp.lastBabyAt||0);if(now()-last<5*DAY)return`다음 아기까지 ${dur(last+5*DAY-now())} 남았어요`;
  if(c.status==='runaway'||sp.status==='runaway')return'가출 중인 고양이가 있어요';
  if(c.st.mood<70)return`${c.name}의 기분이 70 이상이어야 해요`;
  if(c.aff<80)return`${c.name}의 애정도가 80 이상이어야 해요`;

  if(/놀|산책|게임|우다다/.test(text))return m>=40?pick(['좋아! 우다다다!','털실 가져와냥!','레이저 레이저!']):'오늘은 귀찮다냥...';

    case'close':closeSheet();break;
    case'dmenu':deskAction(v,el.dataset.id,e);break;
    case'dcall':deskCall(v,!deskCalled.includes(v));openDeskPanel();break;
    case'dcallall':Object.keys(S.users).forEach(k=>{if(k!==S.me)deskCall(k,true)});openDeskPanel();break;
    case'dsendall':[...deskCalled].forEach(k=>deskCall(k,false));openDeskPanel();break;
    case'dpclose':closeDeskPanel();break;
    case'dset':if(DK&&DK.setSetting){await DK.setSetting(el.dataset.k,!!v);openSettings()}break;
    case'dquit':DK&&DK.quit&&DK.quit();break;
    case'dpet':{if(now()<deskSuppress)break;deskClicked=v;const s=DS[v];if(v==='guest'||(s&&s.away)){DK&&DK.openMain();break}if(s&&s.mine)pet(e);else{spawnHeart(e);friendPet(v)}break}

    case'loginform':S.screen='login';render();break;

function deskLoop(){
  const W=window.innerWidth,H=window.innerHeight,t=now();let need=!!(deskMenu||deskPanel||deskDrag);
  document.querySelectorAll('.dcat').forEach(el=>{
    const id=el.dataset.v,s=DS[id];if(!s)return;const w=el.offsetWidth||120,h=el.offsetHeight||130;
    let walking=false;
    if(s.held){need=true}
    else if(s.y>0||s.vy<0){
      need=true;s.vy=Math.min(s.vy+.9,30);s.y-=s.vy;s.x+=s.vx;s.vx*=.985;
      if(s.x<4||s.x>W-w-4){s.vx=-s.vx*.5}
      if(s.y>H-h){s.y=H-h;if(s.vy<0)s.vy=0}
      if(s.y<=0){
        s.y=0;const hgt=s.fallFrom||0;
        if(s.arriving){deskSay(id,pick(['놀러 왔어요!','안녕! 왔다냥','짠! 나 왔어']),3000)}
        else if(s.vy>7&&hgt>60){s.ouchUntil=t+1500;deskSay(id,hgt>450?'아야야... 너무 높았어!':pick(['아얏!','아야!','으앙 아파!','꽈당!']),2200);el.classList.remove('squash');void el.offsetWidth;el.classList.add('squash');setTimeout(()=>el.classList.remove('squash'),400);renderDesk()}
        s.arriving=false;s.vy=0;s.vx=0;s.fallFrom=0;s.mode='sit';s.until=t+rnd(2e3,5e3);
      }
    }else{
      if(s.sleep)s.mode='sit';
      else if(t>s.until){s.mode=Math.random()<.55?'walk':'sit';s.until=t+(s.mode==='walk'?rnd(4e3,11e3):rnd(5e3,15e3));if(s.mode==='walk'&&Math.random()<.4)s.dir*=-1}
      if(s.mode==='walk'&&!deskOver&&!deskMenu){walking=true;s.x+=s.dir*(s.mine?1.1:.85);if(s.x<4){s.x=4;s.dir=1}if(s.x>W-w-4){s.x=W-w-4;s.dir=-1}}
    }
    if(s.ouchUntil&&s.ouchUntil<t){s.ouchUntil=0;renderDesk()}
    s.x=clamp(s.x,0,Math.max(0,W-w));
    el.classList.toggle('walk',walking);el.classList.toggle('held',!!s.held);
    el.style.transform=`translate(${s.x}px,${-s.y}px)`;
    const f=el.querySelector('.flip');const fd=s.away?1:(s.vx?Math.sign(s.vx):s.dir)||1;if(f._d!==fd){f._d=fd;f.style.transform=`scaleX(${fd})`}
  });
  setFull(need);
  requestAnimationFrame(deskLoop);
}

  setThrough();setFull(true);
}
const callLogT={};
function deskCall(k,on){
  const u=S.users[k];if(!u)return;const c=S.cats[u.main];
  if(on){if(deskCalled.includes(k))return;if(!c||live(c).status==='runaway')return;deskCalled.push(k);saveCalled();
    const H=Math.min(window.screen.availHeight||800,1000);
    DS[c.id]={x:rnd(60,Math.max(80,window.innerWidth-200)),y:H-260,vx:0,vy:0,dir:1,mode:'sit',until:now()+4e3,sig:'',arriving:true,fallFrom:0};
    if(!callLogT[k]||now()-callLogT[k]>10*MIN){callLogT[k]=now();log(`${ownerName(S.me)}님이 ${title(c)}${eulReul(c.name).slice(-1)} 바탕화면에 초대했어요.`)}
  }else{
    deskCalled=deskCalled.filter(x=>x!==k);saveCalled();if(c)delete DS[c.id];
  }
  renderDesk();
}
async function deskAction(a,id,e){
  const s=DS[id];closeDeskMenu();deskClicked=id;
  switch(a){
    case'open':DK&&DK.openMain();break;
    case'hide':DK&&DK.setPetVisible&&DK.setPetVisible(false);break;
    case'quit':DK&&DK.quit&&DK.quit();break;
    case'churu':await feed('churu');break;
    case'kibble':await feed('kibble');break;
    case'play':{const ok=await play();if(ok&&s){s.vy=-15;s.y=Math.max(s.y,1);s.fallFrom=0}break}
    case'call':openDeskPanel();break;
    case'fpet':friendPet(id);break;
    case'gift':await gift(id);break;
    case'talk':{if(!s)break;const el=document.querySelector(`.dcat[data-v="${id}"]`);if(!el)break;
      const m=document.createElement('div');m.id='dmenu';m.innerHTML=`<p>${esc(s.name)}에게 뭐라고 할까요?</p>`+TALK_QUICK.map(q=>`<button data-a="dtalk" data-id="${id}" data-v="${esc(q)}">${esc(q)}</button>`).join('');
      document.body.appendChild(m);m.style.left=clamp(s.x+el.offsetWidth/2-95,8,window.innerWidth-200)+'px';m.style.bottom=(s.y+el.offsetHeight*.75)+'px';deskMenu={id};setThrough();setFull(true);break}
    case'sendhome':if(s){deskSay(id,pick(['안녕~ 또 올게!','집에 갈게옹','재밌었다냥!']),1500);const k=s.owner;setTimeout(()=>deskCall(k,false),1300)}break;
  }
}
if(PET){
  document.addEventListener('mousemove',e=>{const o=!!e.target.closest('.dcat,#dmenu,#dpanel');if(o!==deskOver){deskOver=o}setThrough()});
  document.addEventListener('mouseleave',()=>{deskOver=false;setThrough()});
  document.addEventListener('dblclick',e=>{if(e.target.closest('.dcat'))DK&&DK.openMain()});
  document.addEventListener('contextmenu',e=>{e.preventDefault();const el=e.target.closest('.dcat');if(el)openDeskMenu(el.dataset.v)});
  document.addEventListener('pointerdown',e=>{
    if(deskMenu&&!e.target.closest('#dmenu')){closeDeskMenu();if(!e.target.closest('.dcat'))return}
    if(deskPanel&&!e.target.closest('#dpanel')&&!e.target.closest('.dcat')){closeDeskPanel();return}
    const el=e.target.closest('.dcat');if(!el||e.button!==0)return;
    const s=DS[el.dataset.v];if(!s||s.away)return;
    deskDrag={el,s,id:el.dataset.v,x0:e.clientX,y0:e.clientY,offX:e.clientX-s.x,offB:(window.innerHeight-e.clientY)-s.y,moved:false,lx:e.clientX,ly:e.clientY,lt:now(),vx:0,vy:0};
    try{el.setPointerCapture(e.pointerId)}catch(_){}
    setThrough();setFull(true);
  });
  document.addEventListener('pointermove',e=>{
    const d=deskDrag;if(!d)return;
    if(!d.moved&&Math.hypot(e.clientX-d.x0,e.clientY-d.y0)>6){d.moved=true;d.s.held=true;d.s.vy=0;d.s.vx=0;d.s.arriving=false;deskSay(d.id,pick(['으앗! 어디 가냥?','놓아줘옹!','높다냥...','우와 날아간다!']),1800)}
    if(d.moved){const W=window.innerWidth,H=window.innerHeight,w=d.el.offsetWidth,h=d.el.offsetHeight;
      d.s.x=clamp(e.clientX-d.offX,0,W-w);d.s.y=clamp((H-e.clientY)-d.offB,0,H-h);
      const dt=Math.max(8,now()-d.lt);d.vx=(e.clientX-d.lx)/dt*16;d.vy=(e.clientY-d.ly)/dt*16;d.lx=e.clientX;d.ly=e.clientY;d.lt=now()}
  });
  const endDrag=()=>{const d=deskDrag;if(!d)return;deskDrag=null;
    if(d.moved){d.s.held=false;d.s.fallFrom=d.s.y;d.s.vx=clamp(d.vx,-22,22);d.s.vy=clamp(d.vy,-22,22);if(d.s.y<=0&&d.s.vy<=0)d.s.vy=0;deskSuppress=now()+350}
    setThrough()};
  document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
  window.addEventListener('resize',()=>renderDesk());
  window.addEventListener('storage',e=>{if(e.key==='nyang-session')location.reload()});
  try{if('Notification'in window&&Notification.permission==='default')Notification.requestPermission()}catch(e){}
  requestAnimationFrame(deskLoop);setTimeout(deskChatter,15e3);setTimeout(deskNotify,20e3);
}

/* ================= boot ================= */
const style=document.createElement('style');style.textContent='.tail{animation:wag 2.6s ease-in-out infinite}@keyframes wag{50%{transform:rotate(9deg)}}.blink{transform-origin:100px 93px;animation:blink 5s infinite}.fxa,.fxs,.fxf,.fxp{transform-box:fill-box;transform-origin:center}.fxa{animation:fxa 3.2s ease-in-out infinite}@keyframes fxa{0%{transform:translateY(8px);opacity:0}30%{opacity:1}100%{transform:translateY(-16px);opacity:0}}.fxs{animation:fxs 1.8s ease-in-out infinite}@keyframes fxs{0%,100%{opacity:.25;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}.fxf{animation:fxf 4s linear infinite}@keyframes fxf{0%{transform:translate(0,-10px) rotate(0);opacity:0}15%{opacity:1}100%{transform:translate(-16px,60px) rotate(170deg);opacity:0}}.fxp{animation:fxp 2.6s ease-in-out infinite}@keyframes fxp{50%{opacity:.5}}@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}';document.head.appendChild(style);
await seedDemo();
if(S.session){const u=await Store.get('users/'+S.session.key);if(u&&u.pin===S.session.pin){S.me=S.session.key;S.screen='app';render();subscribe()}else{logout()}}
else render();
})();
</script>
